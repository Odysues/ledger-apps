/* =========================================================
   LOANS
========================================================= */
function loanRepayments(loanId){
  return LOAN_REPAYMENTS.filter(r=>r.loanId===loanId).sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0);
}
function loanPrincipalPaid(loanId){ return loanRepayments(loanId).reduce((s,r)=>s+r.principalPortion,0); }
function loanInterestPaid(loanId){ return loanRepayments(loanId).reduce((s,r)=>s+r.interestPortion,0); }
function loanBalance(loan){ return Math.max(0, loan.principal - loanPrincipalPaid(loan.id)); }
function loanTypeLabel(t){ return {bank:"Bank Loan", director:"Director's Loan", other:"Other Loan"}[t]||"Loan"; }

function renderLoans(){
  const el=document.getElementById("view-loans");
  const totalOutstanding=LOANS.reduce((s,l)=>s+loanBalance(l),0);
  const totalInterestYTD=LOAN_REPAYMENTS.filter(r=>taxYearLabel(new Date(r.date+"T00:00:00"))===taxYearLabel(new Date())).reduce((s,r)=>s+r.interestPortion,0);
  el.innerHTML=`
    <div class="pagehead">
      <div><div class="eyebrow">${LOANS.length} Loan${LOANS.length===1?"":"s"}</div><h2>Loans &amp; Interest</h2></div>
      <button class="fabbtn" id="loanAddBtn" aria-label="Add loan">${ICONS.plus}</button>
    </div>
    <div class="stat-row two">
      <div class="stat-tile expense"><b class="tabular">${money(totalOutstanding)}</b><span>Outstanding</span></div>
      <div class="stat-tile expense"><b class="tabular">${money(totalInterestYTD)}</b><span>Interest Paid YTD</span></div>
    </div>
    <div id="loanList"></div>
  `;
  el.querySelector("#loanAddBtn").addEventListener("click",()=>openLoanForm(null));
  const box=el.querySelector("#loanList");
  if(LOANS.length===0){
    box.innerHTML=`<div class="empty">No loans logged yet.<br><button class="btn btn-accent" id="loanEmptyAdd">+ Add Loan</button></div>`;
    box.querySelector("#loanEmptyAdd").addEventListener("click",()=>openLoanForm(null));
    return;
  }
  box.innerHTML=LOANS.map(l=>{
    const bal=loanBalance(l);
    return `<div class="row" data-loanid="${l.id}">
      <div class="mid"><b>${l.lender}</b><span>${loanTypeLabel(l.type)} · ${l.rate}% interest</span></div>
      <div class="amt expense tabular">${money(bal)}</div>
    </div>`;
  }).join("");
  box.querySelectorAll("[data-loanid]").forEach(row=>row.addEventListener("click",()=>openLoanDetail(row.dataset.loanid)));
}

let currentLoanId=null;
function openLoanDetail(loanId){
  currentLoanId=loanId;
  pushView("loandetail", ()=>renderLoanDetail(loanId));
}
function renderLoanDetail(loanId){
  const el=document.getElementById("view-loandetail");
  const loan=LOANS.find(l=>l.id===loanId);
  if(!loan){ showTab("more"); return; }
  const reps=loanRepayments(loanId);
  const bal=loanBalance(loan);
  const interestPaid=loanInterestPaid(loanId);
  el.innerHTML=`
    <div class="pagehead"><div><div class="eyebrow">${loanTypeLabel(loan.type)}</div><h2>${loan.lender}</h2></div></div>
    <div class="stat-row two">
      <div class="stat-tile expense"><b class="tabular">${money(bal)}</b><span>Outstanding</span></div>
      <div class="stat-tile"><b class="tabular">${loan.rate}%</b><span>Interest Rate</span></div>
    </div>
    <div class="stat-row two">
      <div class="stat-tile"><b class="tabular">${money(loan.principal)}</b><span>Original Principal</span></div>
      <div class="stat-tile expense"><b class="tabular">${money(interestPaid)}</b><span>Interest Paid</span></div>
    </div>
    ${loan.notes?`<p style="color:var(--ink-soft); font-size:13px;">${loan.notes}</p>`:""}
    <button class="btn btn-accent btn-block" id="addRepayBtn" ${bal<=0?"disabled":""}>+ Add Repayment</button>
    <button class="btn btn-ghost btn-block" id="printLoanBtn" style="margin-top:10px;">${ICONS.print} Print / Save PDF</button>
    <div style="display:flex; gap:10px; margin-top:10px;">
      <button class="btn btn-ghost" style="flex:1;" id="editLoanBtn">Edit Loan</button>
      <button class="btn btn-danger" style="flex:1;" id="delLoanBtn">Delete</button>
    </div>
    <div class="section-label">Repayment History</div>
    <div id="repList"></div>
    <div class="invoice-sheet print-sheet">
      ${reportHeaderHTML("Loan Statement", [`As of ${fmtDate(toISO(new Date()))}`])}
      <div class="invoice-to"><div class="lbl">Loan</div><b>${loan.lender}</b><span>${loanTypeLabel(loan.type)} · ${loan.rate}% interest p.a. · Started ${fmtDate(loan.startDate)}</span></div>
      <table class="itable">
        <thead><tr><th>Date</th><th class="num">Payment</th><th class="num">Principal</th><th class="num">Interest</th></tr></thead>
        <tbody>${reps.length?reps.map(r=>`<tr><td>${fmtDate(r.date)}</td><td class="num tabular">${money(r.amount)}</td><td class="num tabular">${money(r.principalPortion)}</td><td class="num tabular">${money(r.interestPortion)}</td></tr>`).join(""):`<tr><td colspan="4" style="color:var(--ink-soft);">No repayments logged.</td></tr>`}</tbody>
      </table>
      <div class="itotals">
        <div><span>Original Principal</span><span class="tabular">${money(loan.principal)}</span></div>
        <div><span>Total Interest Paid</span><span class="tabular">${money(interestPaid)}</span></div>
        <div class="grand"><span>Outstanding Balance</span><span class="tabular">${money(bal)}</span></div>
      </div>
    </div>
  `;
  el.querySelector("#addRepayBtn").addEventListener("click",()=>openRepayForm(loanId));
  el.querySelector("#printLoanBtn").addEventListener("click",()=>window.print());
  el.querySelector("#editLoanBtn").addEventListener("click",()=>openLoanForm(loan));
  el.querySelector("#delLoanBtn").addEventListener("click",()=>{
    const linkedTxIds=loanRepayments(loanId).map(r=>r.linkedTransactionId).filter(Boolean);
    TRANSACTIONS=TRANSACTIONS.filter(t=>!linkedTxIds.includes(t.id));
    saveTransactions();
    LOAN_REPAYMENTS=LOAN_REPAYMENTS.filter(r=>r.loanId!==loanId);
    saveLoanRepayments();
    LOANS=LOANS.filter(l=>l.id!==loanId);
    saveLoans();
    pushView("loans", renderLoans);
  });
  const box=el.querySelector("#repList");
  if(reps.length===0){
    box.innerHTML=`<div class="empty">No repayments logged yet.</div>`;
  } else {
    box.innerHTML=reps.slice().reverse().map(r=>`<div class="row" style="cursor:default;">
      <div class="mid"><b class="tabular">${money(r.amount)}</b><span>${fmtDate(r.date)} · ${money(r.principalPortion)} principal, ${money(r.interestPortion)} interest</span></div>
    </div>`).join("");
  }
}

function openLoanForm(loan){
  if(loan) currentLoanId=loan.id;
  pushView("loanform", ()=>renderLoanForm(loan));
}
function renderLoanForm(loan){
  const el=document.getElementById("view-loanform");
  const isEdit=!!loan;
  el.innerHTML=`
    <div class="formsheet">
      <div class="field"><label>Lender</label><input type="text" id="fLender" value="${loan?loan.lender:""}" placeholder="e.g. Barclays Bank, or your own name"></div>
      <div class="field"><label>Loan Type</label><select id="fType">
        <option value="bank" ${(!loan||loan.type==="bank")?"selected":""}>Bank Loan</option>
        <option value="director" ${loan&&loan.type==="director"?"selected":""}>Director's Loan</option>
        <option value="other" ${loan&&loan.type==="other"?"selected":""}>Other</option>
      </select></div>
      <div class="field-row">
        <div class="field"><label>Principal (£)</label><input type="number" id="fPrincipal" min="0" step="0.01" value="${loan?loan.principal:""}"></div>
        <div class="field"><label>Interest Rate (% p.a.)</label><input type="number" id="fRate" min="0" step="0.01" value="${loan?loan.rate:""}"></div>
      </div>
      <div class="field"><label>Start Date</label><input type="date" id="fStart" value="${loan?loan.startDate:toISO(new Date())}"></div>
      <div class="field"><label>Notes</label><textarea id="fNotes">${loan?(loan.notes||""):""}</textarea></div>
      <button class="btn btn-accent btn-block" id="fSaveLoan">${isEdit?"Save Changes":"Add Loan"}</button>
    </div>
  `;
  el.querySelector("#fSaveLoan").addEventListener("click",()=>{
    const lender=el.querySelector("#fLender").value.trim();
    const principal=parseFloat(el.querySelector("#fPrincipal").value);
    if(!lender || !principal || principal<=0) return;
    const type=el.querySelector("#fType").value;
    const rate=parseFloat(el.querySelector("#fRate").value)||0;
    const startDate=el.querySelector("#fStart").value||toISO(new Date());
    const notes=el.querySelector("#fNotes").value.trim();
    if(isEdit){ Object.assign(loan,{lender,type,principal,rate,startDate,notes}); saveLoans(); openLoanDetail(loan.id); }
    else { loan={id:uid("ln"),lender,type,principal,rate,startDate,notes}; LOANS.push(loan); saveLoans(); openLoanDetail(loan.id); }
  });
}

function openRepayForm(loanId){
  currentLoanId=loanId;
  pushView("repayform", ()=>renderRepayForm(loanId));
}
function renderRepayForm(loanId){
  const el=document.getElementById("view-repayform");
  const loan=LOANS.find(l=>l.id===loanId);
  const bal=loanBalance(loan);
  el.innerHTML=`
    <div class="formsheet">
      <p style="color:var(--ink-soft); font-size:13px; margin-top:-6px;">Outstanding balance: <b class="tabular" style="color:var(--ink);">${money(bal)}</b></p>
      <div class="field"><label>Date</label><input type="date" id="fDate" value="${toISO(new Date())}"></div>
      <div class="field"><label>Total Payment (£)</label><input type="number" id="fAmount" min="0" step="0.01" placeholder="0.00"></div>
      <div class="field"><label>Interest Portion (£)</label><input type="number" id="fInterest" min="0" step="0.01" placeholder="0.00"></div>
      <p style="color:var(--ink-faint); font-size:12px; margin-top:-8px;">The rest goes toward principal. Check your loan statement for the exact split — this creates a Loan Interest expense for the interest portion only.</p>
      <button class="btn btn-accent btn-block" id="fSaveRepay">Add Repayment</button>
    </div>
  `;
  el.querySelector("#fSaveRepay").addEventListener("click",()=>{
    const amount=parseFloat(el.querySelector("#fAmount").value);
    if(!amount || amount<=0) return;
    const date=el.querySelector("#fDate").value||toISO(new Date());
    let interestPortion=parseFloat(el.querySelector("#fInterest").value);
    if(isNaN(interestPortion)||interestPortion<0) interestPortion=0;
    if(interestPortion>amount) interestPortion=amount;
    const principalPortion=amount-interestPortion;
    const rep={id:uid("rp"), loanId, date, amount, interestPortion, principalPortion, linkedTransactionId:null};
    if(interestPortion>0){
      const t={id:uid("tx"), type:"expense", amount:interestPortion, date, category:"loan-interest", description:`Loan interest — ${loan.lender}`, vatRate:0};
      TRANSACTIONS.push(t);
      rep.linkedTransactionId=t.id;
      saveTransactions();
    }
    LOAN_REPAYMENTS.push(rep);
    saveLoanRepayments();
    openLoanDetail(loanId);
  });
}

const CERT_STATUS_LABEL={valid:"Valid", soon:"Due soon", expired:"Expired"};

function renderProperties(){
  const el=document.getElementById("view-properties");
  const rows=rentRollRows();
  const totalExpected=rows.reduce((s,r)=>s+r.expected,0);

  el.innerHTML=`
    <div class="pagehead">
      <div><div class="eyebrow">${PROPERTIES.length} Propert${PROPERTIES.length===1?"y":"ies"}</div><h2>Properties</h2></div>

    box.innerHTML=`<div class="empty">No properties yet.<br><button class="btn btn-accent" id="propEmptyAdd">+ Add Property</button></div>`;

  box.innerHTML=rows.map(r=>{

function renderCertForm(propertyId, cert){
  const el=document.getElementById("view-certform");
  const isEdit=!!cert;
  el.innerHTML=`
    <div class="formsheet">
      <div class="field"><label>Certificate Type</label><select id="fType">
        ${CERT_TYPES.map(t=>`<option value="${t.id}" ${cert&&cert.type===t.id?"selected":""}>${t.label}</option>`).join("")}
      </select></div>
      <div class="field-row">
        <div class="field"><label>Issue Date</label><input type="date" id="fIssue" value="${cert?cert.issueDate:toISO(new Date())}"></div>
        <div class="field"><label>Expiry Date</label><input type="date" id="fExpiry" value="${cert?cert.expiryDate:""}"></div>
      </div>
      <div class="field"><label>Notes</label><textarea id="fNotes">${cert?(cert.notes||""):""}</textarea></div>
      <button class="btn btn-accent btn-block" id="fSaveCert">${isEdit?"Save Changes":"Add Certificate"}</button>
      ${isEdit?`<button class="btn btn-danger btn-block" id="fDelCert" style="margin-top:10px;">Delete</button>`:""}
    </div>
  `;
  let expiryTouched=false;
  el.querySelector("#fExpiry").addEventListener("input",()=>{ expiryTouched=true; });
  function suggestExpiry(){
    if(expiryTouched) return;
    const issueVal=el.querySelector("#fIssue").value;
    if(!issueVal) return;
    const typeId=el.querySelector("#fType").value;
    const t=CERT_TYPES.find(x=>x.id===typeId);
    if(!t) return;
    const d=new Date(issueVal+"T00:00:00");
    d.setMonth(d.getMonth()+t.validMonths);
    el.querySelector("#fExpiry").value=toISO(d);
  }
  el.querySelector("#fIssue").addEventListener("change",suggestExpiry);
  el.querySelector("#fType").addEventListener("change",suggestExpiry);
  if(!isEdit) suggestExpiry();

  el.querySelector("#fSaveCert").addEventListener("click",()=>{
    const type=el.querySelector("#fType").value;
    const issueDate=el.querySelector("#fIssue").value||toISO(new Date());
    const expiryDate=el.querySelector("#fExpiry").value;
    if(!expiryDate){ el.querySelector("#fExpiry").focus(); return; }
    const notes=el.querySelector("#fNotes").value.trim();
    if(isEdit){ Object.assign(cert,{type,issueDate,expiryDate,notes}); }
    else { CERTIFICATES.push({id:uid("cert"),propertyId,type,issueDate,expiryDate,notes}); }
    saveCertificates();
    openPropertyDetail(propertyId);
  });
  const delBtn=el.querySelector("#fDelCert");
  if(delBtn) delBtn.addEventListener("click",()=>{
    CERTIFICATES=CERTIFICATES.filter(c=>c.id!==cert.id);
    saveCertificates();
    openPropertyDetail(propertyId);
  });
}

/* =========================================================
   PROFIT & LOSS REPORT
========================================================= */
function plCategoryTotals(list, type){
  const map={};
  list.filter(t=>t.type===type).forEach(t=>{
    const c=catById(t.category);
    const key=c?c.id:"uncategorised";
    const label=c?c.label:"Uncategorised";
    if(!map[key]) map[key]={label, total:0};
    map[key].total+=t.amount;
  });
  return Object.values(map).sort((a,b)=>b.total-a.total);
}

let plFrom="", plTo="";
function renderPLReport(){
  const el=document.getElementById("view-plreport");
  if(!plFrom && !plTo){
    plFrom=toISO(taxYearStart(new Date()));
    plTo=toISO(new Date());
  }
  el.innerHTML=`
    <div class="pagehead"><div><div class="eyebrow">Report</div><h2>Profit &amp; Loss</h2></div></div>
    <div class="field-row">
      <div class="field"><label>From</label><input type="date" id="plFromInput" value="${plFrom}"></div>
      <div class="field"><label>To</label><input type="date" id="plToInput" value="${plTo}"></div>
    </div>
    <div class="chiprow">
      <button class="chip" id="plThisYear">This Tax Year</button>
      <button class="chip" id="plLastYear">Last Tax Year</button>
    </div>
    <div id="plBody"></div>
  `;
  el.querySelector("#plFromInput").addEventListener("change",e=>{ plFrom=e.target.value; renderBody(); });
  el.querySelector("#plToInput").addEventListener("change",e=>{ plTo=e.target.value; renderBody(); });
  el.querySelector("#plThisYear").addEventListener("click",()=>{
    plFrom=toISO(taxYearStart(new Date())); plTo=toISO(new Date());
    el.querySelector("#plFromInput").value=plFrom; el.querySelector("#plToInput").value=plTo;
    renderBody();
  });
  el.querySelector("#plLastYear").addEventListener("click",()=>{
    const ref=new Date(); ref.setFullYear(ref.getFullYear()-1);
    const s=taxYearStart(ref);
    plFrom=toISO(s); plTo=toISO(new Date(s.getFullYear()+1,3,5));
    el.querySelector("#plFromInput").value=plFrom; el.querySelector("#plToInput").value=plTo;
    renderBody();
  });

  function renderBody(){
    const list=TRANSACTIONS.filter(t=>t.date>=plFrom && t.date<=plTo);
    const income=list.filter(t=>t.type==="income").reduce((s,t)=>s+t.amount,0);
    const expense=list.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0);
    const incomeCats=plCategoryTotals(list,"income");
    const expenseCats=plCategoryTotals(list,"expense");

    const propRows=PROPERTIES.map(p=>({label:propertyLabel(p), ...propertyPL(p.id, plFrom, plTo)})).filter(r=>r.income||r.expense);
    const unassigned=list.filter(t=>!t.propertyId);
    const unassignedIncome=unassigned.filter(t=>t.type==="income").reduce((s,t)=>s+t.amount,0);
    const unassignedExpense=unassigned.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0);

    el.querySelector("#plBody").innerHTML=`
      <div class="stat-row two" style="margin-top:18px;">
        <div class="stat-tile income"><b class="tabular">${money(income)}</b><span>Total Income</span></div>
        <div class="stat-tile expense"><b class="tabular">${money(expense)}</b><span>Total Expenses</span></div>
      </div>
      <div class="card" style="padding:18px; text-align:center; margin-bottom:20px;">
        <div style="font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;">Net Profit</div>
        <div style="font-family:'Newsreader',serif; font-weight:700; font-size:30px; color:${income-expense>=0?"var(--accent)":"var(--danger)"};">${money(income-expense)}</div>
      </div>
      <button class="btn btn-ghost btn-block" id="plPrintBtn" style="margin-bottom:20px;">${ICONS.print} Print / Save PDF</button>

      <div class="section-label">Income by Category</div>
      ${incomeCats.length?incomeCats.map(c=>`<div class="row" style="cursor:default;"><div class="mid"><b>${c.label}</b></div><div class="amt income tabular">${money(c.total)}</div></div>`).join(""):`<div class="empty">No income in this period.</div>`}

      <div class="section-label">Expenses by Category</div>
      ${expenseCats.length?expenseCats.map(c=>`<div class="row" style="cursor:default;"><div class="mid"><b>${c.label}</b></div><div class="amt expense tabular">${money(c.total)}</div></div>`).join(""):`<div class="empty">No expenses in this period.</div>`}

      ${propRows.length?`<div class="section-label">By Property</div>
      ${propRows.map(r=>`<div class="row" style="cursor:default;"><div class="mid"><b>${r.label}</b><span>Income ${money(r.income)} · Expenses ${money(r.expense)}</span></div><div class="amt tabular" style="color:${r.profit>=0?"var(--accent)":"var(--danger)"}">${money(r.profit)}</div></div>`).join("")}
      <div class="row" style="cursor:default;"><div class="mid"><b>Company Overheads</b><span>Not linked to a property · Income ${money(unassignedIncome)} · Expenses ${money(unassignedExpense)}</span></div><div class="amt tabular" style="color:${unassignedIncome-unassignedExpense>=0?"var(--accent)":"var(--danger)"}">${money(unassignedIncome-unassignedExpense)}</div></div>
      `:""}

      <div class="invoice-sheet print-sheet">
        ${reportHeaderHTML("Profit & Loss Report", [`${fmtDate(plFrom)} – ${fmtDate(plTo)}`])}
        <table class="itable">
          <thead><tr><th>Category</th><th class="num">Amount</th></tr></thead>
          <tbody>
            <tr><td style="font-weight:700;">Income</td><td class="num"></td></tr>
            ${incomeCats.map(c=>`<tr><td>${c.label}</td><td class="num tabular">${money(c.total)}</td></tr>`).join("")}
            <tr><td style="font-weight:700;">Expenses</td><td class="num"></td></tr>
            ${expenseCats.map(c=>`<tr><td>${c.label}</td><td class="num tabular">${money(-c.total)}</td></tr>`).join("")}
          </tbody>
        </table>
        <div class="itotals">
          <div><span>Total Income</span><span class="tabular">${money(income)}</span></div>
          <div><span>Total Expenses</span><span class="tabular">${money(expense)}</span></div>
          <div class="grand"><span>Net Profit</span><span class="tabular">${money(income-expense)}</span></div>
        </div>
        ${propRows.length?`<div class="section-label" style="margin-top:20px;">By Property</div>
        <table class="itable">
          <thead><tr><th>Property</th><th class="num">Income</th><th class="num">Expenses</th><th class="num">Profit</th></tr></thead>
          <tbody>
            ${propRows.map(r=>`<tr><td>${r.label}</td><td class="num tabular">${money(r.income)}</td><td class="num tabular">${money(r.expense)}</td><td class="num tabular">${money(r.profit)}</td></tr>`).join("")}
            <tr><td>Company Overheads</td><td class="num tabular">${money(unassignedIncome)}</td><td class="num tabular">${money(unassignedExpense)}</td><td class="num tabular">${money(unassignedIncome-unassignedExpense)}</td></tr>
          </tbody>
        </table>`:""}
      </div>
    `;
    el.querySelector("#plPrintBtn").addEventListener("click",()=>window.print());
  }
  renderBody();
}

function archivedTransactions(){
  return TRANSACTIONS.filter(t=>t.attachmentId).slice().sort((a,b)=> b.date<a.date?-1:b.date>a.date?1:0);
}
function renderArchive(){
  const el=document.getElementById("view-archive");
  const list=archivedTransactions();
  el.innerHTML=`
    <div class="pagehead"><div><div class="eyebrow">${list.length} Saved Invoice${list.length===1?"":"s"}</div><h2>Invoice Archive</h2></div></div>
    <div class="dropzone" id="arDrop">${ICONS.upload}<div>Drop PDF invoices or receipts here (one or several), or tap to choose them<br>The total, VAT, date and supplier are filled in for you</div></div>
    <input type="file" accept="application/pdf,.pdf" id="arFileInput" multiple style="display:none;">
        <div id="arList"></div>
  `;
  const fileInput=el.querySelector("#arFileInput");
  const drop=el.querySelector("#arDrop");
  drop.addEventListener("click",()=>fileInput.click());
  drop.addEventListener("dragover",e=>{ e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave",()=>drop.classList.remove("over"));

  const box=el.querySelector("#arList");

/* =========================================================
   VAT SUMMARY
========================================================= */
let vatQOffset=0;
function renderVat(){
  const el=document.getElementById("view-vat");
  const base=new Date(); base.setMonth(base.getMonth()+vatQOffset*3);
  const qs=quarterStart(base), qe=quarterEnd(base);
  const qsISO=toISO(qs), qeISO=toISO(qe);
  const qTx=TRANSACTIONS.filter(t=>t.date>=qsISO && t.date<=qeISO);
  const outputVat=qTx.filter(t=>t.type==="income").reduce((s,t)=>s+vatAmountFromGross(t.amount,t.vatRate||0),0);
  const inputVat=qTx.filter(t=>t.type==="expense").reduce((s,t)=>s+vatAmountFromGross(t.amount,t.vatRate||0),0);
  const net=outputVat-inputVat;
  el.innerHTML=`
    <div class="pagehead"><div><div class="eyebrow">VAT</div><h2>Quarterly Summary</h2></div></div>
    ${!SETTINGS.vatEnabled?`<div class="empty">VAT tracking is turned off.<br><button class="btn btn-accent" id="enableVatBtn">Turn on VAT tracking</button></div>`:`
    <div class="weekbar">
      <button class="iconbtn" id="vPrev">${ICONS.back}</button>
      <div class="range">${quarterLabel(base)}</div>
      <button class="iconbtn" id="vNext" ${vatQOffset>=0?'disabled style="opacity:.3"':""}>${ICONS.chev}</button>
    </div>
    <div class="stat-row two">
      <div class="stat-tile income"><b class="tabular">${money(outputVat)}</b><span>VAT on Sales</span></div>
      <div class="stat-tile expense"><b class="tabular">${money(inputVat)}</b><span>VAT on Purchases</span></div>
    </div>
    <div class="card" style="padding:18px; text-align:center; margin-bottom:20px;">
      <div style="font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;">${net>=0?"Owed to HMRC":"Reclaimable from HMRC"}</div>
      <div style="font-family:'Newsreader',serif; font-weight:700; font-size:30px; color:${net>=0?"var(--danger)":"var(--accent)"};">${money(Math.abs(net))}</div>
    </div>
    <p style="color:var(--ink-soft); font-size:12.5px;">Based on ${qTx.length} transaction${qTx.length===1?"":"s"} dated ${fmtDate(qsISO)} – ${fmtDate(qeISO)}. This is a simple estimate from your ledger, not a formal VAT return.</p>
    <button class="btn btn-ghost btn-block" id="vPrintBtn" style="margin-top:6px;">${ICONS.print} Print / Save PDF</button>
    <div class="invoice-sheet print-sheet">
      ${reportHeaderHTML("VAT Summary", [quarterLabel(base), `${fmtDate(qsISO)} – ${fmtDate(qeISO)}`])}
      <table class="itable">
        <thead><tr><th>Date</th><th>Description</th><th>Category</th><th class="num">Net</th><th class="num">VAT</th></tr></thead>
        <tbody>${qTx.length?qTx.slice().sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0).map(t=>{
          const c=catById(t.category); const v=vatAmountFromGross(t.amount,t.vatRate||0);
          return `<tr><td>${fmtDate(t.date)}</td><td>${t.description||"—"}</td><td>${c?c.label:"Uncategorised"}</td><td class="num tabular">${t.type==="income"?"":"-"}${money(Math.abs(t.amount-v))}</td><td class="num tabular">${t.type==="income"?"":"-"}${money(v)}</td></tr>`;
        }).join(""):`<tr><td colspan="5" style="color:var(--ink-soft);">No transactions in this quarter.</td></tr>`}</tbody>
      </table>
      <div class="itotals">
        <div><span>VAT on Sales</span><span class="tabular">${money(outputVat)}</span></div>
        <div><span>VAT on Purchases</span><span class="tabular">${money(inputVat)}</span></div>
        <div class="grand"><span>${net>=0?"Owed to HMRC":"Reclaimable from HMRC"}</span><span class="tabular">${money(Math.abs(net))}</span></div>
      </div>
    </div>
    `}
  `;
  const eb=el.querySelector("#enableVatBtn");
  if(eb) eb.addEventListener("click",()=>{ SETTINGS.vatEnabled=true; saveSettings(); renderVat(); });
  const pv=el.querySelector("#vPrev"); if(pv) pv.addEventListener("click",()=>{ vatQOffset--; renderVat(); });
  const nv=el.querySelector("#vNext"); if(nv && vatQOffset<0) nv.addEventListener("click",()=>{ vatQOffset++; renderVat(); });
  const vp=el.querySelector("#vPrintBtn"); if(vp) vp.addEventListener("click",()=>window.print());
}

  `;
  let newType="expense";
  el.querySelectorAll("#newCatSeg .seg").forEach(b=>b.addEventListener("click",()=>{ newType=b.dataset.t; el.querySelectorAll("#newCatSeg .seg").forEach(x=>x.classList.toggle("active",x===b)); }));
  el.querySelector("#addCatBtn").addEventListener("click",()=>{
    const input=el.querySelector("#newCatName");
    const label=input.value.trim();
    if(!label) return;
    const colors=["#1F5C4A","#8C4A2E","#2E6A8C","#5A2E8C","#8C2E6A","#6A8C2E"];
    CATEGORIES.push({id:uid("cat"), label, type:newType, color:colors[CATEGORIES.length%colors.length]});
    saveCategories();
    input.value="";
    renderCategories();
  });
  function catRow(c){
    const inUse=TRANSACTIONS.some(t=>t.category===c.id);
    return `<div class="row" data-cat="${c.id}" style="cursor:default;">
      <span class="catdot" style="background:${c.color}"></span>
      <div class="mid"><b>${c.label}</b>${inUse?'<span>In use</span>':""}</div>
      <button class="inline-del" data-delcat="${c.id}" ${inUse?"disabled":""} title="${inUse?"Category in use":"Delete"}">${ICONS.trash}</button>
    </div>`;
  }
  el.querySelector("#catIncome").innerHTML=CATEGORIES.filter(c=>c.type==="income").map(catRow).join("")||`<div class="empty">None yet.</div>`;
  el.querySelector("#catExpense").innerHTML=CATEGORIES.filter(c=>c.type==="expense").map(catRow).join("")||`<div class="empty">None yet.</div>`;
  el.querySelectorAll("[data-delcat]").forEach(b=>{
    if(b.disabled) return;
    b.addEventListener("click",()=>{
      CATEGORIES=CATEGORIES.filter(c=>c.id!==b.dataset.delcat);
      saveCategories();
      renderCategories();
    });
  });
}

/* =========================================================
   SETTINGS
========================================================= */
function renderSettings(){
  const el=document.getElementById("view-settings");
  el.innerHTML=`
    <div class="pagehead"><div><div class="eyebrow">Settings</div><h2>Your Company</h2></div></div>
    <div class="field"><label>Company Name</label><input type="text" id="sName" value="${SETTINGS.companyName}"></div>
    <div class="field"><label>Address</label><textarea id="sAddress">${SETTINGS.address}</textarea></div>
    <div class="field-row">
      <div class="field"><label>Email</label><input type="email" id="sEmail" value="${SETTINGS.email}"></div>
      <div class="field"><label>Phone</label><input type="text" id="sPhone" value="${SETTINGS.phone}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Companies House No.</label><input type="text" id="sReg" value="${SETTINGS.regNumber}"></div>
      <div class="field"><label>VAT Number</label><input type="text" id="sVatNo" value="${SETTINGS.vatNumber}"></div>
    </div>
    <div class="field" style="display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:13px;">
      <label style="margin:0;">VAT Registered</label>
      <input type="checkbox" id="sVatEnabled" ${SETTINGS.vatEnabled?"checked":""} style="width:20px;height:20px;">
    </div>
    <div class="field-row">
      <div class="field"><label>Invoice Prefix</label><input type="text" id="sInvPrefix" value="${SETTINGS.invoicePrefix}"></div>
      <div class="field"><label>Next Invoice #</label><input type="number" id="sInvNext" value="${SETTINGS.nextInvoiceNumber}"></div>
    </div>
    <button class="btn btn-accent btn-block" id="sSave">Save Settings</button>
    <div class="section-label">Data</div>
    <div class="field" style="display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:13px;">
      <label style="margin:0;">Cloud Sync</label>
      <span id="syncStatusLine" style="font-size:12.5px; color:var(--ink-soft);"></span>
    </div>
    <button class="btn btn-ghost btn-block" id="sExport">Export All Data (JSON)</button>
    <button class="btn btn-ghost btn-block" id="sImport" style="margin-top:10px;">Import Data (JSON)</button>
    <input type="file" id="sImportFile" accept=".json,application/json" hidden>
    <div id="sImportMsg" class="note" style="margin-top:8px;"></div>
    <p class="note" style="margin-top:10px;">Everything is saved in this browser on this device. Use Export regularly as a backup, and Import to move your data to another device or browser. Attached PDFs stay on the device they were added on.</p>
  `;
  renderSettingsSyncStatus();
  el.querySelector("#sSave").addEventListener("click",()=>{
    SETTINGS.companyName=el.querySelector("#sName").value.trim();
    SETTINGS.address=el.querySelector("#sAddress").value.trim();
    SETTINGS.email=el.querySelector("#sEmail").value.trim();
    SETTINGS.phone=el.querySelector("#sPhone").value.trim();
    SETTINGS.regNumber=el.querySelector("#sReg").value.trim();
    SETTINGS.vatNumber=el.querySelector("#sVatNo").value.trim();
    SETTINGS.vatEnabled=el.querySelector("#sVatEnabled").checked;
    SETTINGS.invoicePrefix=el.querySelector("#sInvPrefix").value.trim()||"INV-";
    SETTINGS.nextInvoiceNumber=parseInt(el.querySelector("#sInvNext").value)||1;
    saveSettings();
    showTab("more");
  });
  const importBtn=el.querySelector("#sImport"), importFile=el.querySelector("#sImportFile"), importMsg=el.querySelector("#sImportMsg");
  let pendingImport=null;
  importBtn.addEventListener("click",()=>{
    if(pendingImport){
      applyCloudData(pendingImport);
      const n=(pendingImport.TRANSACTIONS||[]).length;
      pendingImport=null;
      showToast("Imported "+n+" transaction"+(n===1?"":"s"));
      showTab("dashboard");
      return;
    }
    importFile.click();
  });
  importFile.addEventListener("change",async()=>{
    const f=importFile.files[0]; importFile.value="";
    if(!f) return;
    try{
      const data=JSON.parse(await f.text());
      if(!data || !Array.isArray(data.TRANSACTIONS) || !data.SETTINGS) throw new Error("not a ledger export");
      pendingImport=data;
      importMsg.innerHTML=`<b style="color:var(--danger);">This replaces everything in this app</b> with ${data.TRANSACTIONS.length} transactions, ${(data.INVOICES||[]).length} invoices and ${(data.CLIENTS||[]).length} clients from <b>${escHTML(f.name)}</b>. Click <b>Replace my data</b> to continue.`;
      importBtn.textContent="Replace my data";
      importBtn.classList.add("btn-danger"); importBtn.classList.remove("btn-ghost");
    }catch(e){
      pendingImport=null;
      importMsg.innerHTML=`<span style="color:var(--danger);">That file isn't a ledger export. Choose the .json file made by Export All Data.</span>`;
    }
  });
  el.querySelector("#sExport").addEventListener("click", async ()=>{
    const data={SETTINGS,CATEGORIES,TRANSACTIONS,INVOICES,CLIENTS,MILEAGE,PROPERTIES,TENANCIES,CERTIFICATES,LOANS,LOAN_REPAYMENTS};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const downloads = (window.claude && typeof window.claude.use==="function") ? await window.claude.use("downloads") : null;
    if(downloads){
      try{ await downloads.save({filename:"ledger-export.json", data:blob}); }catch(e){ /* declined or unavailable */ }
      return;
    }
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download="ledger-export.json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
}

  el.innerHTML=`

    <div class="more-row" data-go="plreport"><div class="glyph">${ICONS.chart}</div><div class="txt"><b>Profit &amp; Loss Report</b><span>Combined report across all properties</span></div><span class="chev">${ICONS.chev}</span></div>
    <div class="more-row" data-go="archive"><div class="glyph">${ICONS.paperclip}</div><div class="txt"><b>Invoice Archive</b><span>${archivedTransactions().length} saved invoice${archivedTransactions().length===1?"":"s"}</span></div><span class="chev">${ICONS.chev}</span></div>
    <div class="more-row" data-go="loans"><div class="glyph">${ICONS.bank}</div><div class="txt"><b>Loans &amp; Interest</b><span>${LOANS.length?money(LOANS.reduce((s,l)=>s+loanBalance(l),0))+" outstanding":"No loans logged"}</span></div><span class="chev">${ICONS.chev}</span></div>
    <div class="more-row" data-go="mileage"><div class="glyph">${ICONS.car}</div><div class="txt"><b>Mileage</b><span>${MILEAGE.length} trip${MILEAGE.length===1?"":"s"} logged</span></div><span class="chev">${ICONS.chev}</span></div>
    <div class="more-row" data-go="vat"><div class="glyph">${ICONS.percent}</div><div class="txt"><b>VAT Summary</b><span>${SETTINGS.vatEnabled?"View quarterly position":"Currently off"}</span></div><span class="chev">${ICONS.chev}</span></div>
    <div class="more-row" data-go="clients"><div class="glyph">${ICONS.users}</div><div class="txt"><b>Clients</b><span>${CLIENTS.length} saved</span></div><span class="chev">${ICONS.chev}</span></div>
    <div class="more-row" data-go="categories"><div class="glyph">${ICONS.tag}</div><div class="txt"><b>Categories</b><span>${CATEGORIES.length} categories</span></div><span class="chev">${ICONS.chev}</span></div>
    <div class="more-row" data-go="settings"><div class="glyph">${ICONS.gear}</div><div class="txt"><b>Company Settings</b><span>${SETTINGS.companyName||"Add your company details"}</span></div><span class="chev">${ICONS.chev}</span></div>
  `;
  const GO={plreport:renderPLReport, archive:renderArchive, loans:renderLoans, mileage:renderMileage, vat:renderVat, clients:renderClients, categories:renderCategories, settings:renderSettings};
  el.querySelectorAll("[data-go]").forEach(row=>{
    row.addEventListener("click",()=>{
      navReturn="more";
      pushView(row.dataset.go, GO[row.dataset.go]);
    });
  });
}
