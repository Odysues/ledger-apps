<!doctype html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="description" content="Company bookkeeping: income, expenses, invoices, properties, loans, mileage and VAT.">
<title>Ledger</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F5F0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;0,700;1,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  [hidden]{display:none!important}
  img{max-width:100%}
  :root{
    --bg:#F7F5F0; --surface:#FFFFFF; --surface-2:#EFEBE1;
    --ink:#1C1B17; --ink-soft:#6B6558; --ink-faint:#9A927E; --border:#DED8C8;
    --accent:#1F5C4A; --accent-ink:#FFFFFF;
    --danger:#B23A2E; --danger-ink:#FFFFFF;
    --warn:#96681C; --warn-bg:#F1E4C6;
    --shadow: 0 1px 2px rgba(30,25,10,.05), 0 8px 22px -14px rgba(30,25,10,.25);
    --radius:14px;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14140F; --surface:#1D1C16; --surface-2:#242319;
      --ink:#F2EFE6; --ink-soft:#A79F8C; --ink-faint:#6F6857; --border:#332F22;
      --accent:#4CAF8C; --accent-ink:#06231A;
      --danger:#E2685A; --danger-ink:#2A0906;
      --warn:#E8C874; --warn-bg:#332B12;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 22px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14140F; --surface:#1D1C16; --surface-2:#242319;
    --ink:#F2EFE6; --ink-soft:#A79F8C; --ink-faint:#6F6857; --border:#332F22;
    --accent:#4CAF8C; --accent-ink:#06231A;
    --danger:#E2685A; --danger-ink:#2A0906;
    --warn:#E8C874; --warn-bg:#332B12;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 22px -14px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:"Public Sans",-apple-system,"Segoe UI",sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;}
  h1,h2,h3{font-family:"Newsreader",Georgia,serif; font-weight:600; text-wrap:balance; margin:0;}
  ::selection{background:var(--accent); color:var(--accent-ink);}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit; font-size:16px;}
  .tabular{font-variant-numeric:tabular-nums;}
  a{color:inherit;}

  #app{max-width:640px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative;}
  header.topbar{display:flex; align-items:center; gap:12px; padding:calc(14px + var(--safe-t)) 18px 14px; position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--border);}
  .mark{width:36px; height:36px; flex:none; border-radius:9px; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-family:"Newsreader",serif; font-weight:700; font-size:19px; box-shadow:var(--shadow);}
  .brand{display:flex; flex-direction:column; line-height:1.1;}
  .brand b{font-family:"Newsreader",serif; font-weight:700; font-size:19px;}
  .brand span{font-size:10.5px; color:var(--ink-soft); letter-spacing:.05em; text-transform:uppercase;}
  .backbtn,.iconbtn{width:36px; height:36px; border-radius:9px; border:1px solid var(--border); background:var(--surface); color:var(--ink); display:flex; align-items:center; justify-content:center; flex:none; cursor:pointer;}
  .backbtn svg,.iconbtn svg{width:17px; height:17px;}
  .topbar-spacer{flex:1;}

  main{flex:1; padding:18px 18px calc(96px + var(--safe-b));}
  .view{display:none;}
  .view.active{display:block; animation:fade .16s ease;}
  @media (prefers-reduced-motion: reduce){ .view.active{animation:none;} }
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

  nav.tabbar{position:fixed; bottom:0; left:0; right:0; z-index:20; display:flex; justify-content:space-around; background:var(--surface); border-top:1px solid var(--border); padding:8px 4px calc(8px + var(--safe-b));}
  .tab{display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:var(--ink-faint); padding:6px 10px; border-radius:12px; cursor:pointer;}
  .tab svg{width:21px; height:21px;}
  .tab .lbl{font-size:10px; letter-spacing:.02em; font-weight:600; text-transform:uppercase;}
  .tab.active{color:var(--accent);}

  .eyebrow{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:6px;}
  .pagehead{margin-bottom:18px; display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
  .pagehead h2{font-size:27px;}
  .pagehead p{color:var(--ink-soft); font-size:13.5px; margin-top:6px; max-width:52ch;}
  .pagehead .fab{flex:none;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow);}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:11px; padding:13px 18px; font-size:14.5px; font-weight:600; cursor:pointer; min-height:46px;}
  .btn-accent{background:var(--accent); color:var(--accent-ink);}
  .btn-ghost{background:var(--surface); color:var(--ink); border:1px solid var(--border);}
  .btn-danger{background:var(--danger); color:var(--danger-ink);}
  .btn-sm{padding:9px 14px; font-size:13px; min-height:36px; border-radius:9px;}
  .btn-block{width:100%;}
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.4; cursor:default;}
  .fabbtn{width:44px; height:44px; border-radius:12px; background:var(--accent); color:var(--accent-ink); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:var(--shadow);}
  .fabbtn svg{width:20px; height:20px;}
  .btn svg{width:16px; height:16px; flex:none;}

  /* stats */
  .stat-row{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:20px;}
  .stat-row.two{grid-template-columns:repeat(2,1fr);}
  .stat-tile{background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:13px 12px;}
  .stat-tile b{display:block; font-family:"Newsreader",serif; font-weight:700; font-size:21px; line-height:1.1;}
  .stat-tile span{font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;}
  .stat-tile.income b{color:var(--accent);}
  .stat-tile.expense b{color:var(--danger);}

  .weekbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .weekbar .range{font-size:14px; font-weight:600;}

  .section-label{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin:22px 0 10px;}
  .section-label:first-child{margin-top:0;}

  .row{display:flex; align-items:center; gap:12px; padding:12px; background:var(--surface); border:1px solid var(--border); border-radius:12px; margin-bottom:8px; cursor:pointer;}
  .row .catdot{width:9px; height:9px; border-radius:50%; flex:none;}
  .row .mid{flex:1; min-width:0;}
  .row .mid b{display:block; font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .row .mid span{font-size:11.5px; color:var(--ink-soft);}
  .row .amt{font-family:"Newsreader",serif; font-weight:700; font-size:15px; flex:none; text-align:right;}
  .row .amt.income{color:var(--accent);}
  .row .amt.expense{color:var(--danger);}
  .row .clip{width:14px; height:14px; flex:none; color:var(--ink-faint);}
  .row .mid .fname{display:flex; align-items:center; gap:4px; margin-top:2px; color:var(--ink-soft); overflow:hidden; white-space:nowrap; text-overflow:ellipsis;}
  .row .mid .fname svg{width:12px; height:12px; flex:none;}
  .row .mid .fname em{font-style:normal; overflow:hidden; text-overflow:ellipsis;}
  .dup-warn{background:var(--warn-bg); color:var(--warn); border-radius:12px; padding:12px 14px; margin-bottom:12px; font-size:12.5px; line-height:1.5;}
  .dup-warn b{color:var(--warn);}
  .dup-warn ul{margin:6px 0 0; padding-left:18px;}
  .attach-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px;}
  .attach-card .name{display:flex; align-items:center; gap:8px; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;}
  .attach-card .name svg{width:15px; height:15px; flex:none; color:var(--ink-soft);}
  .attach-actions{display:flex; gap:6px; flex:none;}
  .dropzone{border:1.5px dashed var(--border); border-radius:14px; padding:28px 18px; text-align:center; color:var(--ink-soft); font-size:13px; margin-bottom:18px; cursor:pointer;}
  .dropzone svg{width:24px; height:24px; margin-bottom:8px; color:var(--ink-faint);}
  .dropzone.over{border-color:var(--accent); color:var(--accent);}
  .empty{text-align:center; padding:44px 20px; color:var(--ink-soft); font-size:13.5px;}
  .empty .btn{margin-top:14px;}

  .chiprow{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; margin-bottom:16px; -webkit-overflow-scrolling:touch;}
  .chiprow::-webkit-scrollbar{display:none;}
  .chip{flex:none; border:1px solid var(--border); background:var(--surface); color:var(--ink-soft); font-size:12.5px; font-weight:600; padding:8px 14px; border-radius:999px; cursor:pointer; white-space:nowrap;}
  .chip.active{background:var(--ink); color:var(--bg); border-color:var(--ink);}
  .searchbar{margin-bottom:14px;}
  .searchbar input{width:100%; border:1px solid var(--border); background:var(--surface); border-radius:12px; padding:12px 14px; color:var(--ink); outline:none;}
  .searchbar input:focus{border-color:var(--accent);}

  .badge{display:inline-block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:4px 9px; border-radius:999px;}
  .badge.draft{background:var(--surface-2); color:var(--ink-soft);}
  .badge.sent{background:var(--warn-bg); color:var(--warn);}
  .badge.paid{background:var(--accent); color:var(--accent-ink);}
  .badge.overdue{background:var(--danger); color:var(--danger-ink);}

  /* forms */
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; text-transform:uppercase; letter-spacing:.03em;}
  .field input, .field select, .field textarea{width:100%; border:1px solid var(--border); background:var(--surface); border-radius:11px; padding:12px 13px; color:var(--ink); outline:none;}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent);}
  .field textarea{resize:vertical; min-height:70px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .segrow{display:flex; gap:6px; background:var(--surface-2); border:1px solid var(--border); padding:4px; border-radius:12px; margin-bottom:18px;}
  .seg{flex:1; text-align:center; border:none; background:none; color:var(--ink-soft); font-size:13px; font-weight:600; padding:9px 8px; border-radius:9px; cursor:pointer;}
  .seg.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow);}
  .formsheet{padding-bottom:20px;}
  .inline-del{width:34px; height:34px; border-radius:9px; border:none; background:var(--surface-2); color:var(--ink-faint); display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;}
  .inline-del svg{width:15px; height:15px;}

  /* more menu */
  .more-row{display:flex; align-items:center; gap:14px; padding:14px 16px; background:var(--surface); border:1px solid var(--border); border-radius:13px; margin-bottom:10px; cursor:pointer;}
  .more-row .glyph{width:38px; height:38px; border-radius:10px; background:var(--surface-2); color:var(--accent); display:flex; align-items:center; justify-content:center; flex:none;}
  .more-row .glyph svg{width:19px; height:19px;}
  .more-row .txt{flex:1;}
  .more-row .txt b{display:block; font-size:14.5px; font-weight:600;}
  .more-row .txt span{font-size:12px; color:var(--ink-soft);}
  .more-row .chev{color:var(--ink-faint); flex:none;}
  .more-row .chev svg{width:16px; height:16px;}

  /* invoice */
  .invoice-sheet{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:26px 22px; box-shadow:var(--shadow); margin-bottom:18px;}
  .invoice-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px; gap:14px;}
  .invoice-head .from b{font-family:"Newsreader",serif; font-size:19px; font-weight:700; display:block;}
  .invoice-head .from span{font-size:12.5px; color:var(--ink-soft); white-space:pre-line;}
  .invoice-head .meta{text-align:right;}
  .invoice-head .meta .title{font-family:"Newsreader",serif; font-size:22px; font-weight:700;}
  .invoice-head .meta div{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .invoice-to{margin-bottom:20px;}
  .invoice-to .lbl{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); margin-bottom:4px;}
  .invoice-to b{font-size:14.5px;}
  .invoice-to span{display:block; font-size:12.5px; color:var(--ink-soft); white-space:pre-line;}
  table.itable{width:100%; border-collapse:collapse; margin-bottom:6px;}
  table.itable th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); padding:0 8px 8px 0; border-bottom:1px solid var(--border); font-weight:600;}
  table.itable th.num, table.itable td.num{text-align:right;}
  table.itable td{padding:9px 8px 9px 0; border-bottom:1px solid var(--border); font-size:13.5px;}
  .itotals{margin-left:auto; width:220px; margin-top:10px;}
  .itotals div{display:flex; justify-content:space-between; font-size:13.5px; padding:4px 0;}
  .itotals .grand{font-weight:700; font-size:16px; border-top:1px solid var(--border); margin-top:4px; padding-top:8px;}
  .invoice-notes{margin-top:20px; font-size:12.5px; color:var(--ink-soft); white-space:pre-line; border-top:1px solid var(--border); padding-top:14px;}
  .lineitem-row{display:grid; grid-template-columns:1fr 56px 76px 64px 32px; gap:8px; align-items:end; margin-bottom:10px;}
  .lineitem-row .field{margin-bottom:0;}

  .print-sheet{display:none;}

  @media print{
    body *{visibility:hidden;}
    .invoice-sheet, .invoice-sheet *{visibility:visible;}
    .invoice-sheet{position:absolute; top:0; left:0; width:100%; border:none; box-shadow:none; margin:0; padding:0;}
    .print-sheet{display:block !important; visibility:visible;}
    .print-sheet *{visibility:visible;}
    .print-sheet{position:absolute; top:0; left:0; width:100%; border:none; box-shadow:none; margin:0; padding:0;}
  }

  @media (min-width:720px){
    #app{max-width:none; flex-direction:row; width:100%;}
    body{display:flex;}
    nav.tabbar{position:sticky; top:0; bottom:auto; left:0; height:100vh; width:210px; flex-direction:column; justify-content:flex-start; align-items:stretch; gap:6px; border-top:none; border-right:1px solid var(--border); padding:calc(20px + var(--safe-t)) 14px 20px;}
    .tab{flex-direction:row; justify-content:flex-start; padding:11px 14px;}
    .tab .lbl{font-size:13px;}
    .mainarea{flex:1; display:flex; flex-direction:column; max-width:640px; margin:0 auto;}
    .field-row.three{grid-template-columns:repeat(3,1fr);}
  }
  .drop-overlay{position:fixed; inset:0; z-index:60; background:color-mix(in srgb, var(--bg) 88%, transparent); display:flex; align-items:center; justify-content:center; padding:24px; pointer-events:none;}
  .drop-overlay .drop-box{border:2px dashed var(--accent); border-radius:18px; background:var(--surface); padding:34px 28px; text-align:center; max-width:380px; box-shadow:var(--shadow);}
  .drop-overlay svg{width:30px; height:30px; color:var(--accent); margin-bottom:10px;}
  .drop-overlay b{display:block; font-family:"Newsreader",serif; font-size:21px; margin-bottom:6px;}
  .drop-overlay span{font-size:13px; color:var(--ink-soft);}
  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(84px + var(--safe-b)); z-index:70; background:var(--ink); color:var(--bg); font-size:13.5px; font-weight:600; padding:11px 16px; border-radius:11px; box-shadow:var(--shadow); max-width:calc(100% - 32px);}
  .toast.error{background:var(--danger); color:var(--danger-ink);}
  .scan-card{background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:16px; font-size:12.5px; color:var(--ink-soft); line-height:1.5;}
  .scan-card b{color:var(--ink);}
  .scan-card.warn{background:var(--warn-bg); color:var(--warn); border-color:transparent;}
  .scan-card.warn b{color:var(--warn);}
  .pagehead-actions{display:flex; gap:8px; flex:none;}
  .ghostfab{width:44px; height:44px; border-radius:12px; background:var(--surface); color:var(--accent); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .ghostfab svg{width:19px; height:19px;}
  @media (min-width:720px){ .toast{bottom:28px;} }
  .note{color:var(--ink-soft); font-size:12.5px; line-height:1.5;}
  .batch-item{padding:14px; margin-bottom:12px;}
  .batch-item.off{opacity:.55;}
  .batch-item .field{margin-bottom:10px;}
  .batch-head{display:flex; gap:10px; align-items:flex-start; margin-bottom:12px; cursor:pointer;}
  .batch-head input{width:20px; height:20px; margin-top:1px; flex:none; accent-color:var(--accent);}
  .batch-name{display:flex; align-items:center; gap:6px; font-weight:600; font-size:13.5px; word-break:break-all;}
  .batch-name svg{width:14px; height:14px; flex:none; color:var(--ink-soft);}
  .batch-sum{font-size:12px; color:var(--ink-soft); margin-top:3px; line-height:1.45;}
</style>
</head>
<body>
<div class="drop-overlay" id="dropOverlay" hidden><div class="drop-box">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
  <b>Drop your PDFs</b><span>The total, VAT, date and supplier are read automatically, and the file is saved with the transaction.</span>
</div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" accept="application/pdf,.pdf" id="receiptInput" multiple hidden>

<div id="app">
  <nav class="tabbar" id="tabbar"></nav>
  <div class="mainarea">
    <header class="topbar" id="topbar"></header>
    <main>
      <section class="view" id="view-dashboard"></section>
      <section class="view" id="view-ledger"></section>
      <section class="view" id="view-invoices"></section>
      <section class="view" id="view-more"></section>
      <section class="view" id="view-txform"></section>
      <section class="view" id="view-invoiceform"></section>
      <section class="view" id="view-invoicedetail"></section>
      <section class="view" id="view-mileage"></section>
      <section class="view" id="view-mileageform"></section>
      <section class="view" id="view-vat"></section>
      <section class="view" id="view-clients"></section>
      <section class="view" id="view-clientform"></section>
      <section class="view" id="view-categories"></section>
      <section class="view" id="view-settings"></section>
      <section class="view" id="view-loans"></section>
      <section class="view" id="view-loandetail"></section>
      <section class="view" id="view-loanform"></section>
      <section class="view" id="view-repayform"></section>
      <section class="view" id="view-properties"></section>
      <section class="view" id="view-propertydetail"></section>
      <section class="view" id="view-propertyform"></section>
      <section class="view" id="view-tenancyform"></section>
      <section class="view" id="view-certform"></section>
      <section class="view" id="view-plreport"></section>
      <section class="view" id="view-archive"></section>
      <section class="view" id="view-batch"></section>
    </main>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
"use strict";

/* =========================================================
   ICONS
========================================================= */

/* =========================================================
   INVOICE ATTACHMENTS
   PDF files are kept on this device only, in IndexedDB (they're
   too large for the synced JSON ledger doc). The transaction
   record itself — amount, date, category — still syncs normally.
========================================================= */
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const ATTACH_DB="ledger_attachments_v1", ATTACH_STORE="files";
let attachDBPromise=null;
function openAttachDB(){
  if(attachDBPromise) return attachDBPromise;
  attachDBPromise=new Promise((resolve,reject)=>{
    const req=indexedDB.open(ATTACH_DB,1);
    req.onupgradeneeded=()=>{ req.result.createObjectStore(ATTACH_STORE,{keyPath:"id"}); };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
  return attachDBPromise;
}
async function saveAttachment(id, file){
  const db=await openAttachDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(ATTACH_STORE,"readwrite");
    tx.objectStore(ATTACH_STORE).put({id, blob:file, filename:file.name, savedAt:Date.now()});
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  });
}
async function getAttachment(id){
  const db=await openAttachDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(ATTACH_STORE,"readonly");
    const req=tx.objectStore(ATTACH_STORE).get(id);
    req.onsuccess=()=>resolve(req.result||null);
    req.onerror=()=>reject(req.error);
  });
}
async function deleteAttachment(id){
  if(!id) return;
  try{
    const db=await openAttachDB();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(ATTACH_STORE,"readwrite");
      tx.objectStore(ATTACH_STORE).delete(id);
      tx.oncomplete=()=>resolve();
      tx.onerror=()=>reject(tx.error);
    });
  }catch(e){ /* best-effort cleanup */ }
}
let lastAttachUrl=null;
async function openAttachment(id){
  const rec=await getAttachment(id);
  if(!rec) return false;
  if(lastAttachUrl) URL.revokeObjectURL(lastAttachUrl);
  lastAttachUrl=URL.createObjectURL(rec.blob);
  window.open(lastAttachUrl, "_blank");
  return true;
}

// Best-effort extraction — works on text-based PDFs (most emailed invoices and receipts), not on scanned photos.
async function pdfTextLines(file){
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const lines=[];
  for(let i=1;i<=pdf.numPages;i++){
    const page=await pdf.getPage(i);
    const content=await page.getTextContent();
    // group text fragments into visual rows by their y position, then read each row left to right
    const rows=[];
    content.items.forEach(item=>{
      if(!item.str || !item.str.trim()) return;
      const x=item.transform[4], y=item.transform[5];
      let row=rows.find(r=>Math.abs(r.y-y)<=3);
      if(!row){ row={y, parts:[]}; rows.push(row); }
      row.parts.push({x, s:item.str});
    });
    rows.sort((a,b)=>b.y-a.y);
    rows.forEach(r=>{
      r.parts.sort((a,b)=>a.x-b.x);
      const text=r.parts.map(p=>p.s).join(" ").replace(/\s+/g," ").trim();
      if(text) lines.push(text);
    });
  }
  return lines;
}

const MONTHS_SHORT=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
function amountsIn(line){
  const re=/(?<![\d.,])(?:[£$€]\s?)?(\d{1,3}(?:,\d{3})+|\d+)\.(\d{2})(?![\d])(?!\s?%)/g;
  return [...line.matchAll(re)].map(m=>parseFloat(m[1].replace(/,/g,"")+"."+m[2]));
}
function dateIn(line){
  const ok=(y,m,d)=> y>=2000 && y<=2100 && m>=1 && m<=12 && d>=1 && d<=31;
  const iso=(y,m,d)=>`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  let m=line.match(/\b(\d{4})-(\d{1,2})-(\d{1,2})\b/);
  if(m && ok(+m[1],+m[2],+m[3])) return iso(+m[1],+m[2],+m[3]);
  m=line.match(/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})\b/);
  if(m){ const y=m[3].length===2?2000+ +m[3]:+m[3]; if(ok(y,+m[2],+m[1])) return iso(y,+m[2],+m[1]); }
  m=line.match(/\b(\d{1,2})(?:st|nd|rd|th)?[\s\-]+([A-Za-z]{3,9})\.?,?[\s\-]+(\d{4}|\d{2})\b/);
  if(m){ const mi=MONTHS_SHORT.indexOf(m[2].slice(0,3).toLowerCase()); const y=m[3].length===2?2000+ +m[3]:+m[3]; if(mi>=0 && ok(y,mi+1,+m[1])) return iso(y,mi+1,+m[1]); }
  m=line.match(/\b([A-Za-z]{3,9})\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(\d{4})\b/);
  if(m){ const mi=MONTHS_SHORT.indexOf(m[1].slice(0,3).toLowerCase()); if(mi>=0 && ok(+m[3],mi+1,+m[2])) return iso(+m[3],mi+1,+m[2]); }
  return null;
}

// Pure parser: takes the PDF's text rows (top to bottom) and returns best guesses.
function parseInvoiceLines(lines){
  const text=lines.join("\n");
  if(text.replace(/\s/g,"").length<20) return {scanned:true, amount:null, date:null, vendor:""};

  // Total: largest amount on any "total"-style line that isn't a subtotal / VAT / net line
  const totalRe=/(grand\s*total|total\s*(due|payable|to\s*pay|paid|amount|gbp|inc|incl|including)|(amount|balance)\s*(due|payable|paid|owing|to\s*pay)|invoice\s*total|order\s*total|\btotal\b)/i;
  const notTotalRe=/(sub\s*-?\s*total|total\s*(vat|tax|net|ex\b|excl|excluding|before|items?|qty|quantity|discount|savings?)|(vat|tax|net)\s*total|total\s*weight)/i;
  const totals=[];
  lines.forEach((l,i)=>{
    if(!totalRe.test(l) || notTotalRe.test(l)) return;
    let nums=amountsIn(l);
    if(!nums.length && lines[i+1]) nums=amountsIn(lines[i+1]).slice(0,1);
    if(nums.length) totals.push(nums[nums.length-1]);
  });
  let amount=totals.filter(n=>n>0).length ? Math.max(...totals.filter(n=>n>0)) : null;
  if(amount==null){
    const cur=[...text.matchAll(/[£$€]\s?(\d{1,3}(?:,\d{3})+|\d+)\.(\d{2})(?!\d)/g)].map(m=>parseFloat(m[1].replace(/,/g,"")+"."+m[2]));
    if(cur.length) amount=Math.max(...cur);
  }

  // VAT and net
  let vat=null, net=null;
  const vatCands=[];
  lines.forEach(l=>{
    if(/\b(vat|tax)\b/i.test(l) && !/\b(vat|tax)\s*(reg\w*|no\.?|number|id|code)\b/i.test(l) && !/sub\s*-?\s*total|total\s*(inc|incl|including)|grand\s*total|excl|excluding/i.test(l)){
      const nums=amountsIn(l);
      if(nums.length) vatCands.push(nums[nums.length-1]);
    }
    if(net==null && /(sub\s*-?\s*total|net\s*(total|amount|value)|total\s*(ex\b|excl|excluding|before|net))/i.test(l)){
      const nums=amountsIn(l);
      if(nums.length) net=nums[nums.length-1];
    }
  });
  if(amount!=null && vatCands.length){
    const fits=v=>[0.2,0.05].some(r=>Math.abs(v-amount*r/(1+r))<=Math.max(0.03,amount*0.002));
    vat=vatCands.find(fits);
    if(vat==null) vat=vatCands.find(v=>v===0) ?? vatCands.filter(v=>v<amount/2).sort((a,b)=>b-a)[0] ?? null;
  }
  if(vat==null && net!=null && amount!=null && amount>net) vat=Math.round((amount-net)*100)/100;
  let vatRate=null;
  if(vat===0) vatRate=0;
  else if(vat!=null && amount!=null && amount>vat){
    const r=vat/(amount-vat)*100;
    if(Math.abs(r-20)<=1.5) vatRate=20; else if(Math.abs(r-5)<=1) vatRate=5;
  }

  // Date: prefer a labelled invoice/receipt date, skip due dates
  let date=null;
  const labelled=lines.filter(l=>/(invoice|issue|receipt|order|transaction|tax\s*point)\s*date|date\s*(of\s*issue|issued)|^date\b|\bdate\s*:/i.test(l) && !/\bdue\b/i.test(l));
  for(const l of labelled){ date=dateIn(l); if(date) break; }
  if(!date){ for(const l of lines){ if(/\bdue\b/i.test(l)) continue; date=dateIn(l); if(date) break; } }

  // Invoice number
  let numMatch=null;
  for(const l of lines){ numMatch=l.match(/\b(invoice|receipt|order|inv)[ \t]*(no\.?|number|#|ref\w*)[ \t]*[:#.]?[ \t]*([A-Z]{0,5}[-\/]?\d[A-Z0-9\-\/]*)/i); if(numMatch) break; }
  const invoiceNo=numMatch?numMatch[3]:"";

  // Who is it from, and is it one of yours?
  const skipRe=/^(tax\s*)?(invoice|receipt|statement|credit note|page\b|date\b|bill\s*to|invoice\s*to|sold\s*to|ship\s*to|deliver)|@|www\.|https?:|^\+?[\d\s()-]{7,}$|^\d/i;
  const billIdx=lines.findIndex(l=>/\b(bill(ed)?\s*to|invoice\s*to|sold\s*to|customer)\b/i.test(l));
  const header=(billIdx>0?lines.slice(0,billIdx):lines.slice(0,8)).join(" ").toLowerCase();
  const myNames=[SETTINGS.companyName].filter(n=>n && n.trim().length>=3).map(n=>n.toLowerCase());
  const isMine=myNames.some(n=>header.includes(n));
  let vendor="";
  if(isMine && billIdx>=0){
    const after=lines[billIdx].replace(/.*\b(bill(ed)?\s*to|invoice\s*to|sold\s*to|customer)\b\s*:?\s*/i,"").trim();
    vendor=(after && !skipRe.test(after)) ? after : (lines.slice(billIdx+1).find(l=>!skipRe.test(l))||"");
  } else {
    vendor=lines.slice(0,12).find(l=>l.length>=3 && !skipRe.test(l) && !totalRe.test(l) && !myNames.some(n=>l.toLowerCase().includes(n)))||"";
  }
  vendor=vendor.slice(0,60);

  let category=null;
  const type=isMine?"income":"expense";
  if(type==="income") category="sales";
  else { const low=text.toLowerCase(); for(const [ids,re] of CATEGORY_HINTS){ if(!re.test(low)) continue; const id=ids.find(x=>CATEGORIES.some(c=>c.id===x)); if(id){ category=id; break; } } }

  return {scanned:false, amount, date, vendor, vat, net, vatRate, invoiceNo, type, category};
}

async function extractInvoiceDataFromPDF(file){
  if(!window.pdfjsLib) return {amount:null, date:null, vendor:"", failed:true};
  return parseInvoiceLines(await pdfTextLines(file));
}

/* =========================================================
   PDF IMPORT — drop a PDF anywhere, or tap "Scan PDF"
========================================================= */
function showToast(msg, isError){
  const t=document.getElementById("toast");
  if(!t) return;
  t.textContent=msg;
  t.classList.toggle("error", !!isError);
  t.hidden=false;
  clearTimeout(showToast._timer);
  showToast._timer=setTimeout(()=>{ t.hidden=true; }, isError?5000:2500);
}
function isPdf(file){ return file && (file.type==="application/pdf" || /\.pdf$/i.test(file.name||"")); }
let importBusy=false;
function withTimeout(promise, ms){
  return Promise.race([promise, new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")), ms))]);
}
async function importReceiptFile(file, propertyId){
  if(importBusy) return;
  if(!isPdf(file)){ showToast("That isn't a PDF. Drop a PDF invoice or receipt.", true); return; }
  importBusy=true;
  try{
    const t=document.getElementById("toast");
    t.textContent="Reading "+file.name+"…"; t.classList.remove("error"); t.hidden=false; clearTimeout(showToast._timer);
    let guess;
    try{ guess=await withTimeout(extractInvoiceDataFromPDF(file), 15000); }
    catch(e){ guess={amount:null,date:null,vendor:"",failed:true}; }
    let attachmentId=uid("att"), attachmentName=file.name;
    let attachmentHash=null;
    try{ attachmentHash=await withTimeout(fileHash(file), 5000); }catch(e){}
    try{ await withTimeout(saveAttachment(attachmentId, file), 8000); }
    catch(e){ attachmentId=null; attachmentName=null; guess.notSaved=true; }
    t.hidden=true;
    openTxForm(null, propertyId||null, {attachmentId, attachmentName, attachmentHash, guess});
  } finally {
    importBusy=false;
  }
}
/* =========================================================
   SEVERAL PDFs AT ONCE — read them all, then review on one screen
========================================================= */
function importReceiptFiles(files, propertyId){
  const all=[...files];
  const pdfs=all.filter(isPdf);
  const skipped=all.length-pdfs.length;
  const skipMsg=()=>{ if(skipped) setTimeout(()=>showToast(skipped+" file"+(skipped===1?" wasn't a PDF and was":"s weren't PDFs and were")+" skipped"), 600); };
  if(!pdfs.length){ showToast("That isn't a PDF. Drop PDF invoices or receipts.", true); return; }
  if(pdfs.length===1){ importReceiptFile(pdfs[0], propertyId); skipMsg(); return; }
  importBatch(pdfs, propertyId).then(skipMsg);
}
async function importBatch(pdfs, propertyId){
  if(importBusy) return;
  importBusy=true;
  const t=document.getElementById("toast");
  const items=[];
  try{
    for(let i=0;i<pdfs.length;i++){
      const file=pdfs[i];
      t.textContent=`Reading ${i+1} of ${pdfs.length}: ${file.name}…`; t.classList.remove("error"); t.hidden=false; clearTimeout(showToast._timer);
      let guess;
      try{ guess=await withTimeout(extractInvoiceDataFromPDF(file), 15000); }
      catch(e){ guess={amount:null,date:null,vendor:"",failed:true}; }
      let attachmentHash=null;
      try{ attachmentHash=await withTimeout(fileHash(file), 5000); }catch(e){}
      let attachmentId=uid("att");
      try{ await withTimeout(saveAttachment(attachmentId, file), 8000); }
      catch(e){ attachmentId=null; guess.notSaved=true; }
      items.push({name:file.name, attachmentId, attachmentHash, guess});
    }
  } finally {
    importBusy=false;
  }
  t.hidden=true;
  openBatch(items, propertyId||null);
}

let batchItems=[], batchProperty=null;
function openBatch(items, propertyId){
  batchProperty=propertyId;
  batchItems=items.map((it,i)=>{
    const g=it.guess||{};
    const dups=findDuplicates({attachmentHash:it.attachmentHash, attachmentName:it.name, amount:g.amount, date:g.date, type:g.type}, null)
      .map(d=>`${escHTML(d.t.description||"Transaction")} (${money(d.t.amount)}, ${fmtDate(d.t.date)}): ${d.reason}`);
    items.slice(0,i).forEach(prev=>{
      if(it.attachmentHash && prev.attachmentHash===it.attachmentHash) dups.push(`the same file appears earlier in this batch (${escHTML(prev.name)})`);
    });
    return {...it, dups, include:dups.length===0};
  });
  pushView("batch", renderBatch);
}
function discardBatch(){
  batchItems.forEach(it=>{ if(it.attachmentId) deleteAttachment(it.attachmentId); });
  batchItems=[];
  if(batchProperty) openPropertyDetail(batchProperty); else showTab(navReturn);
}
function batchCatOptions(type, selected){
  return CATEGORIES.filter(c=>c.type===type).map(c=>`<option value="${c.id}" ${c.id===selected?"selected":""}>${escHTML(c.label)}</option>`).join("");
}
function batchSummary(g, notSaved){
  let s;
  if(g.scanned) s=`<span style="color:var(--danger);">No text found (looks like a scanned photo). Enter the details.</span>`;
  else if(g.failed) s=`<span style="color:var(--danger);">Couldn't read this PDF. Enter the details.</span>`;
  else {
    const bits=[];
    if(g.amount!=null) bits.push("Total "+money(g.amount)); else bits.push(`<span style="color:var(--danger);">No total found</span>`);
    if(g.vat!=null) bits.push("VAT "+money(g.vat));
    if(g.date) bits.push(fmtDate(g.date));
    if(g.invoiceNo) bits.push("No. "+escHTML(g.invoiceNo));
    if(g.type==="income") bits.push("your own invoice");
    s="Read: "+bits.join(" · ");
  }
  return s+(notSaved?` · <span style="color:var(--warn);">file not kept on this device</span>`:"");
}

        <div class="field-row">
          <div class="field"><label>Type</label><select class="b-type">

        </div>

          <div class="field"><label>Category</label><select class="b-cat">${batchCatOptions(type, g.category)}</select></div>
        </div>

        ${SETTINGS.vatEnabled?`<div class="field" style="margin-bottom:0;"><label>VAT rate</label><select class="b-vat">
          <option value="0" ${vat===0?"selected":""}>No VAT</option><option value="5" ${vat===5?"selected":""}>5%</option><option value="20" ${vat===20?"selected":""}>20%</option>
        </select></div>`:""}

    }).join("")}</div>
    <button class="btn btn-accent btn-block" id="bAdd"></button>
    <button class="btn btn-ghost btn-block" id="bCancel" style="margin-top:10px;">Cancel and discard these PDFs</button>
  `;
  const addBtn=el.querySelector("#bAdd");
  const label=()=>{ const n=count(); addBtn.textContent=n?`Add ${n} transaction${n===1?"":"s"}`:"Tick at least one PDF"; addBtn.disabled=!n; };
  label();
  el.querySelectorAll(".batch-item").forEach(card=>{

    card.querySelector(".b-inc").addEventListener("change",e=>{ it.include=e.target.checked; card.classList.toggle("off",!it.include); label(); });
    card.querySelector(".b-type").addEventListener("change",e=>{ card.querySelector(".b-cat").innerHTML=batchCatOptions(e.target.value, it.guess&&it.guess.type===e.target.value?it.guess.category:null); });
    card.querySelector(".b-amount").addEventListener("input",e=>{ card.querySelector(".b-err").hidden=true; e.target.style.borderColor=""; });
  });
  el.querySelector("#bCancel").addEventListener("click",discardBatch);
  addBtn.addEventListener("click",()=>{
    const cards=[...el.querySelectorAll(".batch-item")];
    const toAdd=[]; let firstBad=null;
    cards.forEach(card=>{
      const it=batchItems[+card.dataset.i];
      if(!it.include) return;
      const amtIn=card.querySelector(".b-amount");

    batchItems.forEach(it=>{ if(!it.include && it.attachmentId) deleteAttachment(it.attachmentId); });
    toAdd.forEach(t=>TRANSACTIONS.push(t));
    batchItems=[];
    saveTransactions();
    if(batchProperty) openPropertyDetail(batchProperty);
    else { ledgerFilter="all"; ledgerSearch=""; ledgerFrom=""; ledgerTo=""; showTab("ledger"); }
    showToast("Added "+toAdd.length+" transaction"+(toAdd.length===1?"":"s"));
  });
}
function pickReceipt(propertyId){
  const input=document.getElementById("receiptInput");
  input.onchange=()=>{ const files=[...input.files]; input.value=""; if(files.length) importReceiptFiles(files, propertyId); };
  input.click();
}
function wireGlobalDrop(){
  const overlay=document.getElementById("dropOverlay");
  let depth=0;
  const hasFiles=e=>e.dataTransfer && [...(e.dataTransfer.types||[])].includes("Files");
  document.addEventListener("dragenter",e=>{ if(!hasFiles(e)) return; e.preventDefault(); depth++; overlay.hidden=false; });
  document.addEventListener("dragover",e=>{ if(!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect="copy"; });
  document.addEventListener("dragleave",e=>{ if(!hasFiles(e)) return; depth=Math.max(0,depth-1); if(!depth) overlay.hidden=true; });
  document.addEventListener("drop",e=>{
    if(!hasFiles(e)) return;
    e.preventDefault(); depth=0; overlay.hidden=true;
    const files=[...e.dataTransfer.files];

    const onProperty=document.getElementById("view-propertydetail").classList.contains("active") ? currentPropertyId : null;
    importReceiptFiles(files, onProperty);
  });
}

/* =========================================================
   CLOUD SYNC (Claude "db" capability — syncs this ledger across
   every device signed into the same Claude account)
========================================================= */
let cloudDoc=null;
let cloudStatus="off"; // off | connecting | synced | local-only | error
let lastAppliedAt=0;
let cloudSyncTimer=null;

function currentStateSnapshot(){
  return {SETTINGS,CATEGORIES,TRANSACTIONS,INVOICES,CLIENTS,MILEAGE,PROPERTIES,TENANCIES,CERTIFICATES,LOANS,LOAN_REPAYMENTS};
}
function applyCloudData(data){
  // Synced data arrives frozen (read-only); take an editable copy so new transactions etc. can be added
  data=JSON.parse(JSON.stringify(data));
  SETTINGS=data.SETTINGS||SETTINGS; saveJSON("ledger_settings_v1", SETTINGS);
  CATEGORIES=data.CATEGORIES||CATEGORIES; saveJSON("ledger_categories_v1", CATEGORIES);
  TRANSACTIONS=data.TRANSACTIONS||[]; saveJSON("ledger_transactions_v1", TRANSACTIONS);
  INVOICES=data.INVOICES||[]; saveJSON("ledger_invoices_v1", INVOICES);
  CLIENTS=data.CLIENTS||[]; saveJSON("ledger_clients_v1", CLIENTS);
  MILEAGE=data.MILEAGE||[]; saveJSON("ledger_mileage_v1", MILEAGE);
  PROPERTIES=data.PROPERTIES||[]; saveJSON("ledger_properties_v1", PROPERTIES);
  TENANCIES=data.TENANCIES||[]; saveJSON("ledger_tenancies_v1", TENANCIES);
  CERTIFICATES=data.CERTIFICATES||[]; saveJSON("ledger_certificates_v1", CERTIFICATES);
  LOANS=data.LOANS||[]; saveJSON("ledger_loans_v1", LOANS);
  LOAN_REPAYMENTS=data.LOAN_REPAYMENTS||[]; saveJSON("ledger_loan_repayments_v1", LOAN_REPAYMENTS);
  const activeEl=document.querySelector(".view.active");
  const id=activeEl?activeEl.id.replace("view-",""):"";
  if(ROOT_VIEWS.includes(id)) showTab(currentTab);
  else if(id==="propertydetail" && currentPropertyId) renderPropertyDetail(currentPropertyId);
  else if(id==="loandetail" && currentLoanId) renderLoanDetail(currentLoanId);
}
async function pushCloudState(){
  if(!cloudDoc) return;
  const updatedAt=Date.now();
  const payload=Object.assign({updatedAt}, currentStateSnapshot());
  try{
    await cloudDoc.set(payload);
    lastAppliedAt=updatedAt;
    cloudStatus="synced";
  }catch(e){
    cloudStatus="error";
  }
  renderSettingsSyncStatus();
}
function queueCloudSync(){
  if(!cloudDoc) return;
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer=setTimeout(pushCloudState, 700);
}
async function initCloudSync(){
  if(!(window.claude && typeof window.claude.use==="function")){ cloudStatus="local-only"; return; }
  cloudStatus="connecting";
  let db;
  try{ db=await window.claude.use("db"); }catch(e){ db=null; }
  if(!db){ cloudStatus="local-only"; renderSettingsSyncStatus(); return; }
  cloudDoc=db.doc("ledger/data");
  cloudDoc.onSnapshot(snap=>{
    if(snap.exists){
      const data=snap.data();
      if(data && typeof data.updatedAt==="number" && data.updatedAt>lastAppliedAt){
        lastAppliedAt=data.updatedAt;
        applyCloudData(data);
      }
      cloudStatus="synced";
    } else {
      pushCloudState();
    }
    renderSettingsSyncStatus();
  }, ()=>{ cloudStatus="error"; renderSettingsSyncStatus(); });
}
function renderSettingsSyncStatus(){
  const el=document.getElementById("syncStatusLine");
  if(!el) return;
  const LABEL={off:"Not started", connecting:"Connecting…", synced:"Synced across your devices", "local-only":"Saved in this browser only", error:"Sync error — data still saved on this device"};
  el.textContent=LABEL[cloudStatus]||"";
}

function uid(prefix){ return (prefix||"id")+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* =========================================================
   MONEY / DATE / TAX HELPERS
========================================================= */
function money(n){
  const v = Math.round((n||0)*100)/100;
  const neg = v<0;
  const s = Math.abs(v).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2});
  return (neg?"-£":"£")+s;
}
function toISO(d){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0"); return `${y}-${m}-${dd}`; }
function fmtDate(iso){
  if(!iso) return "";
  const d=new Date(iso+"T00:00:00");
  return d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
}
const MONTH_NAMES=["January","February","March","April","May","June","July","August","September","October","November","December"];
function monthLabel(d){ return MONTH_NAMES[d.getMonth()]+" "+d.getFullYear(); }
function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function addMonths(d,n){ return new Date(d.getFullYear(), d.getMonth()+n, 1); }

// UK tax year: 6 April - 5 April
function taxYearStart(d){
  const y = (d.getMonth()>3 || (d.getMonth()===3 && d.getDate()>=6)) ? d.getFullYear() : d.getFullYear()-1;
  return new Date(y,3,6);
}
function taxYearLabel(d){
  const s=taxYearStart(d);
  return `${s.getFullYear()}/${String(s.getFullYear()+1).slice(2)}`;
}
// UK VAT quarters: simple calendar quarters (Jan-Mar, Apr-Jun, Jul-Sep, Oct-Dec)
function quarterStart(d){ const q=Math.floor(d.getMonth()/3); return new Date(d.getFullYear(), q*3, 1); }
function quarterEnd(d){ const s=quarterStart(d); return new Date(s.getFullYear(), s.getMonth()+3, 0); }
function quarterLabel(d){ const q=Math.floor(d.getMonth()/3)+1; return `Q${q} ${d.getFullYear()}`; }

function vatAmountFromGross(gross, ratePct){
  if(!ratePct) return 0;
  return gross - gross/(1+ratePct/100);
}

function reportHeaderHTML(title, metaLines){
  return `<div class="invoice-head">
    <div class="from"><b>${SETTINGS.companyName||"Your Company"}</b><span>${[SETTINGS.address,SETTINGS.email,SETTINGS.phone].filter(Boolean).join("\n")}${SETTINGS.vatNumber?"\nVAT No: "+SETTINGS.vatNumber:""}${SETTINGS.regNumber?"\nCompany No: "+SETTINGS.regNumber:""}</span></div>
    <div class="meta"><div class="title">${title}</div>${metaLines.map(m=>`<div>${m}</div>`).join("")}</div>
  </div>`;
}

/* =========================================================
   MILEAGE RATE (HMRC AMAP)
========================================================= */
function mileageRateFor(vehicleType, milesBeforeThisTrip){
  if(vehicleType==="motorcycle") return 24;
  if(vehicleType==="bicycle") return 20;
  return milesBeforeThisTrip < 10000 ? 45 : 25; // car
}
function recalcMileageAmounts(){
  const byYear={};
  const sorted=MILEAGE.slice().sort((a,b)=> a.date===b.date ? 0 : (a.date<b.date?-1:1));
  sorted.forEach(m=>{
    const ty=taxYearLabel(new Date(m.date+"T00:00:00"));
    if(m.vehicleType==="car"){
      byYear[ty]=byYear[ty]||0;
      const rate=mileageRateFor("car", byYear[ty]);
      m.rate=rate;
      m.amount=Math.round(m.miles*rate)/100;
      byYear[ty]+=m.miles;
    } else {
      const rate=mileageRateFor(m.vehicleType,0);
      m.rate=rate;
      m.amount=Math.round(m.miles*rate)/100;
    }
  });
}

/* =========================================================
   PROPERTIES / TENANCIES / CERTIFICATES
========================================================= */
function propertyById(id){ return PROPERTIES.find(p=>p.id===id); }
function propertyLabel(p){ return p.nickname ? p.nickname : p.address.split("\n")[0]; }
function propertyTenancies(propertyId){
  return TENANCIES.filter(t=>t.propertyId===propertyId).sort((a,b)=> a.startDate<b.startDate?-1:a.startDate>b.startDate?1:0);
}
function activeTenancy(propertyId){
  const today=toISO(new Date());
  const live=TENANCIES.filter(t=>t.propertyId===propertyId && t.startDate<=today && (!t.endDate||t.endDate>=today));
  live.sort((a,b)=> b.startDate<a.startDate?-1:1);
  return live[0]||null;
}
function monthlyRentFor(tenancy){
  if(!tenancy) return 0;
  return tenancy.rentFrequency==="weekly" ? tenancy.rentAmount*52/12 : tenancy.rentAmount;
}
function propertyTransactions(propertyId){ return TRANSACTIONS.filter(t=>t.propertyId===propertyId); }
function propertyPL(propertyId, fromISO, toISOd){
  const list=propertyTransactions(propertyId).filter(t=> (!fromISO||t.date>=fromISO) && (!toISOd||t.date<=toISOd));
  const income=list.filter(t=>t.type==="income").reduce((s,t)=>s+t.amount,0);
  const expense=list.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0);
  return {income, expense, profit:income-expense};
}
function propertyCertificates(propertyId){
  return CERTIFICATES.filter(c=>c.propertyId===propertyId).sort((a,b)=> a.expiryDate<b.expiryDate?-1:1);
}
const CERT_TYPES=[
  {id:"gas", label:"Gas Safety Certificate", validMonths:12},
  {id:"eicr", label:"EICR (Electrical Safety)", validMonths:60},
  {id:"epc", label:"EPC (Energy Performance)", validMonths:120},
  {id:"alarm", label:"Smoke & CO Alarms Check", validMonths:12},
  {id:"other", label:"Other", validMonths:12},
];
function certTypeLabel(id){ const t=CERT_TYPES.find(c=>c.id===id); return t?t.label:"Certificate"; }
function certStatus(cert){
  const today=toISO(new Date());
  if(cert.expiryDate<today) return "expired";
  const days=(new Date(cert.expiryDate+"T00:00:00")-new Date(today+"T00:00:00"))/86400000;
  if(days<=30) return "soon";
  return "valid";
}
function propertyWorstCertStatus(propertyId){
  const certs=propertyCertificates(propertyId);
  if(certs.some(c=>certStatus(c)==="expired")) return "expired";
  if(certs.some(c=>certStatus(c)==="soon")) return "soon";
  return "valid";
}
function rentRollRows(){
  const mStart=toISO(startOfMonth(new Date())), mEnd=toISO(addMonths(new Date(),1));
  return PROPERTIES.map(p=>{
    const tenancy=activeTenancy(p.id);
    if(!tenancy) return {property:p, tenancy:null, expected:0, received:0, status:"void"};
    const expected=monthlyRentFor(tenancy);
    const received=TRANSACTIONS.filter(t=>t.propertyId===p.id && t.type==="income" && t.date>=mStart && t.date<mEnd).reduce((s,t)=>s+t.amount,0);
    const status = received>=expected-0.01 ? "paid" : (received>0 ? "partial" : "due");
    return {property:p, tenancy, expected, received, status};
  });
}

function escHTML(v){ return String(v==null?"":v).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch])); }
function escAttr(v){ return escHTML(v); }
async function fileHash(file){
  if(!(window.crypto && crypto.subtle)) return null;
  const buf=await crypto.subtle.digest("SHA-256", await file.arrayBuffer());
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
// Existing transactions that look like the same thing: same PDF file, same file name, or same amount + date + type
function findDuplicates(c, excludeId){
  const same=(a,b)=>Math.abs((a||0)-(b||0))<0.005;
  const out=[];
  TRANSACTIONS.forEach(t=>{
    if(t.id===excludeId) return;
    let reason=null;
    if(c.attachmentHash && t.attachmentHash && t.attachmentHash===c.attachmentHash) reason="the same PDF was already added";
    else if(c.attachmentName && t.attachmentName && t.attachmentName.toLowerCase()===c.attachmentName.toLowerCase()) reason="a PDF with the same file name was already added";
    else if(c.amount!=null && same(t.amount,c.amount) && t.date===c.date && (!c.type || t.type===c.type)) reason="same amount on the same date";
    if(reason) out.push({t, reason});
  });
  return out;
}

}

function scanSummaryCore(g){
  if(g.scanned) return `<div class="scan-card warn"><b>No text found in this PDF.</b> It looks like a scanned photo, so the details can't be read automatically. The file is attached; enter the amount and date below.</div>`;
  if(g.failed) return `<div class="scan-card warn"><b>Couldn't read this PDF.</b> The file is attached; enter the details below.</div>`;
  const bits=[];
  if(g.amount!=null) bits.push(`Total <b class="tabular">${money(g.amount)}</b>`);
  if(g.vat!=null) bits.push(`VAT <b class="tabular">${money(g.vat)}</b>${g.vatRate!=null?` (${g.vatRate}%)`:""}`);
  if(g.date) bits.push(`Dated <b>${fmtDate(g.date)}</b>`);
  if(g.invoiceNo) bits.push(`No. <b>${g.invoiceNo}</b>`);
  const who=g.type==="income"?`This looks like one of your own invoices${g.vendor?" to <b>"+g.vendor+"</b>":""}, so it's set as income.`:(g.vendor?`From <b>${g.vendor}</b>.`:"");
  if(g.amount==null) return `<div class="scan-card warn"><b>Couldn't find a total in this PDF.</b> ${bits.join(" · ")} ${who} Enter the amount below.</div>`;
  return `<div class="scan-card"><b>Read from the PDF:</b> ${bits.join(" · ")}. ${who} Check the details before saving.</div>`;
}
function renderTxForm(tx, presetPropertyId, pendingAttachment){
  const el=document.getElementById("view-txform");
  const isEdit=!!tx;
  const guess=pendingAttachment&&pendingAttachment.guess || {};
  const type=tx?tx.type:(guess.type||"expense");
  const guessVat=(!tx && guess.vatRate!=null) ? guess.vatRate : null;
  const cats=CATEGORIES.filter(c=>c.type===type);
  const selectedPropertyId = tx ? (tx.propertyId||"") : (presetPropertyId||"");
  let attachmentId = isEdit ? (tx.attachmentId||null) : (pendingAttachment?pendingAttachment.attachmentId:null);
  let attachmentName = isEdit ? (tx.attachmentName||null) : (pendingAttachment?pendingAttachment.attachmentName:null);
  let attachmentHash = isEdit ? (tx.attachmentHash||null) : (pendingAttachment?pendingAttachment.attachmentHash||null:null);
  const pdfDups = (!isEdit && pendingAttachment) ? findDuplicates({attachmentHash, attachmentName, amount:guess.amount, date:guess.date, type:guess.type}, null) : [];
  let dupConfirmed=false;
  el.innerHTML=`
    <div class="formsheet">
      <div class="segrow" id="txTypeSeg">
        <button class="seg" data-t="expense">Expense</button>
        <button class="seg" data-t="income">Income</button>
      </div>
      <div id="attachBox"></div>
      ${pendingAttachment?scanSummaryHTML(guess):""}
      ${!isEdit&&!pendingAttachment?`<button type="button" class="btn btn-ghost btn-block" id="fScanPdf" style="margin-bottom:16px;">${ICONS.upload} Fill in from a PDF</button>`:""}
      <div class="field"><label for="fAmount">Amount (£)</label><input type="number" step="0.01" min="0" inputmode="decimal" id="fAmount" value="${isEdit?tx.amount:(guess.amount!=null?guess.amount:"")}" placeholder="0.00">
        <div id="fAmountErr" style="font-size:12.5px; color:var(--danger); margin-top:6px;" hidden>Enter the amount before adding the transaction.</div>
      </div>
      <div class="field"><label>Date</label><input type="date" id="fDate" value="${isEdit?tx.date:(guess.date||toISO(new Date()))}"></div>
      <div class="field"><label>Category</label><select id="fCategory"></select></div>
      <div class="field"><label>Description</label><input type="text" id="fDesc" value="${isEdit?(tx.description||""):[guess.vendor,guess.invoiceNo?"Inv "+guess.invoiceNo:""].filter(Boolean).join(" · ")}" placeholder="What was this for?"></div>
      ${PROPERTIES.length?`<div class="field"><label>Property</label><select id="fProperty">
        <option value="">No property (general)</option>
        ${PROPERTIES.map(p=>`<option value="${p.id}" ${selectedPropertyId===p.id?"selected":""}>${propertyLabel(p)}</option>`).join("")}
      </select></div>`:""}
      ${SETTINGS.vatEnabled?`<div class="field"><label>VAT rate</label><select id="fVat">
        <option value="0" ${(tx&&tx.vatRate===0)||guessVat===0?"selected":""}>No VAT</option>
        <option value="5" ${(tx&&tx.vatRate===5)||guessVat===5?"selected":""}>5% (reduced)</option>
        <option value="20" ${(!tx&&(guessVat===null||guessVat===20))||(tx&&tx.vatRate===20)?"selected":""}>20% (standard)</option>
      </select></div>`:""}
      <div class="dup-warn" id="fDupWarn" hidden></div>
      <button class="btn btn-accent btn-block" id="fSave">${isEdit?"Save Changes":"Add Transaction"}</button>
      ${isEdit?`<button class="btn btn-danger btn-block" id="fDelete" style="margin-top:10px;">Delete</button>`:""}
    </div>
  `;
  function renderAttachBox(){
    const box=el.querySelector("#attachBox");
    if(!attachmentId){ box.innerHTML=""; return; }
    box.innerHTML=`<div class="attach-card">
      <span class="name">${ICONS.paperclip}${attachmentName||"invoice.pdf"}</span>
      <div class="attach-actions">
        <button type="button" class="btn btn-ghost btn-sm" id="fViewAttach">View</button>
        <button type="button" class="btn btn-ghost btn-sm" id="fRemoveAttach">Remove</button>
      </div>
    </div>`;
    box.querySelector("#fViewAttach").addEventListener("click",()=>openAttachment(attachmentId));
    box.querySelector("#fRemoveAttach").addEventListener("click",()=>{
      deleteAttachment(attachmentId);
      attachmentId=null; attachmentName=null; attachmentHash=null;
      renderAttachBox();
    });
  }
  renderAttachBox();
  const scanPdfBtn=el.querySelector("#fScanPdf");
  if(scanPdfBtn) scanPdfBtn.addEventListener("click",()=>pickReceipt(presetPropertyId));

  function populateCategories(t){
    const sel=el.querySelector("#fCategory");
    const list=CATEGORIES.filter(c=>c.type===t);
    const want=tx?tx.category:(t===guess.type?guess.category:null);
    sel.innerHTML=list.map(c=>`<option value="${c.id}" ${want===c.id?"selected":""}>${c.label}</option>`).join("");
  }
  let curType=type;
  el.querySelectorAll("#txTypeSeg .seg").forEach(b=>{
    b.classList.toggle("active", b.dataset.t===curType);
    b.addEventListener("click",()=>{ curType=b.dataset.t; el.querySelectorAll("#txTypeSeg .seg").forEach(x=>x.classList.toggle("active",x===b)); populateCategories(curType); });
  });
  populateCategories(curType);

  el.querySelector("#fAmount").addEventListener("input",()=>{ el.querySelector("#fAmountErr").hidden=true; el.querySelector("#fAmount").style.borderColor=""; });
  const dupWarn=el.querySelector("#fDupWarn");
  const saveBtn=el.querySelector("#fSave");
  function showDupWarning(dups, atTop){
    dupWarn.innerHTML=`<b>This might be a duplicate.</b> You already have:${dupListHTML(dups)}${atTop?"":"Click <b>Add anyway</b> to add it again, or go back to cancel."}`;
    dupWarn.hidden=false;
    if(!atTop){ saveBtn.textContent="Add anyway"; dupWarn.scrollIntoView({block:"center", behavior:"smooth"}); }
  }
  if(pdfDups.length){
    const top=document.createElement("div");
    top.className="dup-warn";
    top.innerHTML=`<b>You may have added this already.</b>${dupListHTML(pdfDups)}`;
    el.querySelector("#attachBox").after(top);
    showToast("Possible duplicate: check before adding", true);
  }
  el.querySelectorAll("#fAmount,#fDate,#txTypeSeg .seg").forEach(x=>x.addEventListener(x.tagName==="BUTTON"?"click":"input",()=>{
    if(dupConfirmed || !dupWarn.hidden){ dupConfirmed=false; dupWarn.hidden=true; saveBtn.textContent=isEdit?"Save Changes":"Add Transaction"; }
  }));
  function afterSave(){
    saveTransactions();
    if(txFormReturn) openPropertyDetail(txFormReturn); else showTab(navReturn);
  }
  el.querySelector("#fSave").addEventListener("click",()=>{
    const amountInput=el.querySelector("#fAmount");
    const amount=parseFloat(String(amountInput.value).replace(/[£,\s]/g,""));
    const amountErr=el.querySelector("#fAmountErr");
    if(!amount || amount<=0){
      amountErr.hidden=false;
      amountInput.style.borderColor="var(--danger)";
      amountInput.scrollIntoView({block:"center", behavior:"smooth"});
      amountInput.focus();
      return;
    }
    const date=el.querySelector("#fDate").value || toISO(new Date());
    const category=el.querySelector("#fCategory").value;
    const description=el.querySelector("#fDesc").value.trim();
    const vatRate=SETTINGS.vatEnabled ? parseFloat(el.querySelector("#fVat").value) : 0;
    const propSel=el.querySelector("#fProperty");
    const propertyId=propSel ? (propSel.value||null) : null;
    if(!isEdit && !dupConfirmed){
      const dups=findDuplicates({attachmentHash, attachmentName, amount, date, type:curType}, null);
      if(dups.length){ dupConfirmed=true; showDupWarning(dups, false); return; }
    }
    if(isEdit){
      Object.assign(tx, {type:curType, amount, date, category, description, vatRate, propertyId, attachmentId, attachmentName, attachmentHash});
    } else {
      TRANSACTIONS.push({id:uid("tx"), type:curType, amount, date, category, description, vatRate, propertyId, attachmentId, attachmentName, attachmentHash});
    }
    afterSave();
    showToast(isEdit?"Changes saved":"Transaction added: "+money(amount));
  });
  const delBtn=el.querySelector("#fDelete");
  if(delBtn) delBtn.addEventListener("click",()=>{
    if(tx.attachmentId) deleteAttachment(tx.attachmentId);
    TRANSACTIONS=TRANSACTIONS.filter(t=>t.id!==tx.id);
    afterSave();
  });
}

/* =========================================================
   INVOICES
========================================================= */
function invoiceTotal(inv){
  let subtotal=0, vat=0;
  (inv.lineItems||[]).forEach(li=>{
    const line=(li.qty||0)*(li.unitPrice||0);
    subtotal+=line;
    vat+=line*(li.vatRate||0)/100;
  });
  return {subtotal, vat, total:subtotal+vat};
}
function invoiceStatusComputed(inv){
  if(inv.status==="paid") return "paid";
  if(inv.status==="draft") return "draft";
  if(inv.dueDate && inv.dueDate < toISO(new Date())) return "overdue";
  return "sent";
}
let invFrom="", invTo="";
function renderInvoices(){
  const el=document.getElementById("view-invoices");
  const inRange=i=>(!invFrom||i.issueDate>=invFrom) && (!invTo||i.issueDate<=invTo);
  const list=INVOICES.filter(inRange).sort((a,b)=> b.issueDate<a.issueDate?-1:b.issueDate>a.issueDate?1:0);
  const totals=list.reduce((acc,i)=>{
    const t=invoiceTotal(i).total, st=invoiceStatusComputed(i);
    if(st!=="draft") acc.all+=t;
    if(st==="paid") acc.paid+=t;
    if(st==="sent"||st==="overdue") acc.out+=t;
    return acc;
  },{all:0,paid:0,out:0});
  const filtered=!!(invFrom||invTo);
  el.innerHTML=`
    <div class="pagehead">
      <div><div class="eyebrow">${filtered?`${list.length} of ${INVOICES.length}`:INVOICES.length} Invoice${INVOICES.length===1?"":"s"}</div><h2>Invoices</h2></div>
      <button class="fabbtn" id="iAddBtn" aria-label="New invoice">${ICONS.plus}</button>
    </div>
    ${INVOICES.length?`
    <div class="chiprow" id="iPeriod">${periodChipsHTML(invFrom,invTo)}</div>
    <div class="field-row">
      <div class="field"><label for="iFrom">Issued from</label><input type="date" id="iFrom" value="${invFrom}"></div>
      <div class="field"><label for="iTo">Issued to</label><input type="date" id="iTo" value="${invTo}"></div>
    </div>
    <div class="stat-row">
      <div class="stat-tile"><b class="tabular">${money(totals.all)}</b><span>Invoiced</span></div>
      <div class="stat-tile income"><b class="tabular">${money(totals.paid)}</b><span>Paid</span></div>
      <div class="stat-tile ${totals.out>0?"expense":""}"><b class="tabular">${money(totals.out)}</b><span>Outstanding</span></div>
    </div>`:""}
    <div id="iList"></div>
  `;
  el.querySelector("#iAddBtn").addEventListener("click",()=>openInvoiceForm(null));
  el.querySelectorAll("#iPeriod .chip").forEach(c=>c.addEventListener("click",()=>{ invFrom=c.dataset.from; invTo=c.dataset.to; renderInvoices(); }));
  const fromIn=el.querySelector("#iFrom"), toIn=el.querySelector("#iTo");
  if(fromIn) fromIn.addEventListener("change",e=>{ invFrom=e.target.value; renderInvoices(); });
  if(toIn) toIn.addEventListener("change",e=>{ invTo=e.target.value; renderInvoices(); });
  const box=el.querySelector("#iList");
  if(INVOICES.length===0){
    box.innerHTML=`<div class="empty">No invoices yet.<br><button class="btn btn-accent" id="iEmptyAdd">+ New Invoice</button></div>`;
    box.querySelector("#iEmptyAdd").addEventListener("click",()=>openInvoiceForm(null));
    return;
  }
  if(list.length===0){
    box.innerHTML=`<div class="empty">No invoices issued in this period.<br><button class="btn btn-ghost" id="iShowAll">Show all invoices</button></div>`;
    box.querySelector("#iShowAll").addEventListener("click",()=>{ invFrom=""; invTo=""; renderInvoices(); });
    return;
  }
  box.innerHTML=list.map(inv=>{
    const client=CLIENTS.find(c=>c.id===inv.clientId);
    const status=invoiceStatusComputed(inv);
    const {total}=invoiceTotal(inv);
    return `<div class="row" data-invid="${inv.id}">
      <div class="mid"><b>${SETTINGS.invoicePrefix}${String(inv.number).padStart(4,"0")} · ${client?escHTML(client.name):"No client"}</b><span>Issued ${fmtDate(inv.issueDate)}${inv.dueDate?" · Due "+fmtDate(inv.dueDate):""}${status==="paid"&&inv.paidDate?" · Paid "+fmtDate(inv.paidDate):""} <span class="badge ${status}" style="margin-left:6px;">${status}</span></span></div>
      <div class="amt income tabular">${money(total)}</div>
    </div>`;
  }).join("");
  box.querySelectorAll("[data-invid]").forEach(row=>{
    row.addEventListener("click",()=>openInvoiceDetail(INVOICES.find(i=>i.id===row.dataset.invid)));
  });
}

function openInvoiceDetail(inv){
  pushView("invoicedetail", ()=>renderInvoiceDetail(inv));
}
function renderInvoiceDetail(inv){
  const el=document.getElementById("view-invoicedetail");
  const client=CLIENTS.find(c=>c.id===inv.clientId);
  const {subtotal,vat,total}=invoiceTotal(inv);
  const status=invoiceStatusComputed(inv);
  el.innerHTML=`
    <div class="invoice-sheet">
      <div class="invoice-head">
        <div class="from"><b>${SETTINGS.companyName||"Your Company"}</b><span>${[SETTINGS.address,SETTINGS.email,SETTINGS.phone].filter(Boolean).join("\n")}${SETTINGS.vatNumber?"\nVAT No: "+SETTINGS.vatNumber:""}${SETTINGS.regNumber?"\nCompany No: "+SETTINGS.regNumber:""}</span></div>
        <div class="meta"><div class="title">Invoice</div><div>${SETTINGS.invoicePrefix}${String(inv.number).padStart(4,"0")}</div><div>Issued ${fmtDate(inv.issueDate)}</div><div>Due ${fmtDate(inv.dueDate)}</div></div>
      </div>
      <div class="invoice-to"><div class="lbl">Bill To</div><b>${client?client.name:"—"}</b><span>${client?[client.email,client.address].filter(Boolean).join("\n"):""}</span></div>
      <table class="itable">
        <thead><tr><th>Description</th><th class="num">Qty</th><th class="num">Unit Price</th>${SETTINGS.vatEnabled?'<th class="num">VAT</th>':""}<th class="num">Amount</th></tr></thead>
        <tbody>${(inv.lineItems||[]).map(li=>`<tr><td>${li.description}</td><td class="num tabular">${li.qty}</td><td class="num tabular">${money(li.unitPrice)}</td>${SETTINGS.vatEnabled?`<td class="num tabular">${li.vatRate}%</td>`:""}<td class="num tabular">${money(li.qty*li.unitPrice)}</td></tr>`).join("")}</tbody>
      </table>
      <div class="itotals">
        <div><span>Subtotal</span><span class="tabular">${money(subtotal)}</span></div>
        ${SETTINGS.vatEnabled?`<div><span>VAT</span><span class="tabular">${money(vat)}</span></div>`:""}
        <div class="grand"><span>Total</span><span class="tabular">${money(total)}</span></div>
      </div>
      ${inv.notes?`<div class="invoice-notes">${inv.notes}</div>`:""}
    </div>
    <div style="display:flex; gap:10px; margin-bottom:10px;">
      <span class="badge ${status}" style="padding:8px 14px; font-size:12px;">${status}</span>
    </div>
    <div style="display:flex; flex-direction:column; gap:10px;">
      ${status!=="paid"?`<button class="btn btn-accent btn-block" id="markPaidBtn">Mark as Paid</button>`:""}
      ${inv.status==="draft"?`<button class="btn btn-ghost btn-block" id="markSentBtn">Mark as Sent</button>`:""}
      <button class="btn btn-ghost btn-block" id="printBtn">${ICONS.print} Print / Save PDF</button>
      <button class="btn btn-ghost btn-block" id="editInvBtn">Edit Invoice</button>
      <button class="btn btn-danger btn-block" id="delInvBtn">Delete Invoice</button>
    </div>
  `;
  const paidBtn=el.querySelector("#markPaidBtn");
  if(paidBtn) paidBtn.addEventListener("click",()=>{
    inv.status="paid"; inv.paidDate=toISO(new Date());
    if(!inv.linkedTransactionId){
      const t={id:uid("tx"), type:"income", amount:total, date:inv.paidDate, category:"sales", description:`Invoice ${SETTINGS.invoicePrefix}${String(inv.number).padStart(4,"0")}${client?" — "+client.name:""}`, vatRate: subtotal>0?Math.round((vat/subtotal)*100):0};
      TRANSACTIONS.push(t);
      inv.linkedTransactionId=t.id;
      saveTransactions();
    }
    saveInvoices();
    renderInvoiceDetail(inv);
  });
  const sentBtn=el.querySelector("#markSentBtn");
  if(sentBtn) sentBtn.addEventListener("click",()=>{ inv.status="sent"; saveInvoices(); renderInvoiceDetail(inv); });
  el.querySelector("#printBtn").addEventListener("click",()=>window.print());
  el.querySelector("#editInvBtn").addEventListener("click",()=>openInvoiceForm(inv));
  el.querySelector("#delInvBtn").addEventListener("click",()=>{
    if(inv.linkedTransactionId){ TRANSACTIONS=TRANSACTIONS.filter(t=>t.id!==inv.linkedTransactionId); saveTransactions(); }
    INVOICES=INVOICES.filter(i=>i.id!==inv.id);
    saveInvoices();
    showTab("invoices");
  });
}

function openInvoiceForm(inv){
  pushView("invoiceform", ()=>renderInvoiceForm(inv));
}
function renderInvoiceForm(inv){
  const el=document.getElementById("view-invoiceform");
  const isEdit=!!inv;
  let lineItems=inv? inv.lineItems.map(x=>({...x})) : [{description:"",qty:1,unitPrice:0,vatRate:SETTINGS.defaultVatRate}];

  function draw(){
    el.innerHTML=`
      <div class="formsheet">
        <div class="field"><label>Client</label>
          <select id="fClient">
            <option value="">Select a client…</option>
            ${CLIENTS.map(c=>`<option value="${c.id}" ${inv&&inv.clientId===c.id?"selected":""}>${c.name}</option>`).join("")}
          </select>
        </div>
        <button class="btn btn-ghost btn-sm" id="newClientBtn" style="margin-bottom:16px;">+ New client</button>
        <div class="field-row">
          <div class="field"><label>Issue date</label><input type="date" id="fIssue" value="${inv?inv.issueDate:toISO(new Date())}"></div>
          <div class="field"><label>Due date</label><input type="date" id="fDue" value="${inv?inv.dueDate:toISO(new Date(Date.now()+14*86400000))}"></div>
        </div>
        <div class="section-label">Line Items</div>
        <div id="liList"></div>
        <button class="btn btn-ghost btn-sm" id="addLineBtn">+ Add line</button>
        <div class="field" style="margin-top:18px;"><label>Notes</label><textarea id="fNotes">${inv?(inv.notes||""):"Payment due within 14 days. Thank you for your business."}</textarea></div>
        <button class="btn btn-accent btn-block" id="fSaveInv" style="margin-top:6px;">${isEdit?"Save Changes":"Create Invoice"}</button>
      </div>
    `;
    const liBox=el.querySelector("#liList");
    liBox.innerHTML=lineItems.map((li,i)=>`
      <div class="lineitem-row" data-i="${i}">
        <div class="field"><label>${i===0?"Description":""}</label><input type="text" class="li-desc" value="${li.description}" placeholder="Item or service"></div>
        <div class="field"><label>${i===0?"Qty":""}</label><input type="number" class="li-qty" value="${li.qty}" min="0" step="1"></div>
        <div class="field"><label>${i===0?"Price":""}</label><input type="number" class="li-price" value="${li.unitPrice}" min="0" step="0.01"></div>
        ${SETTINGS.vatEnabled?`<div class="field"><label>${i===0?"VAT":""}</label><select class="li-vat"><option value="0" ${li.vatRate===0?"selected":""}>0%</option><option value="5" ${li.vatRate===5?"selected":""}>5%</option><option value="20" ${li.vatRate===20?"selected":""}>20%</option></select></div>`:'<div></div>'}
        <button class="inline-del" data-rm="${i}">${ICONS.trash}</button>
      </div>
    `).join("");
    liBox.querySelectorAll(".lineitem-row").forEach(row=>{
      const i=+row.dataset.i;
      row.querySelector(".li-desc").addEventListener("input",e=>lineItems[i].description=e.target.value);
      row.querySelector(".li-qty").addEventListener("input",e=>lineItems[i].qty=parseFloat(e.target.value)||0);
      row.querySelector(".li-price").addEventListener("input",e=>lineItems[i].unitPrice=parseFloat(e.target.value)||0);
      const vatSel=row.querySelector(".li-vat");
      if(vatSel) vatSel.addEventListener("change",e=>lineItems[i].vatRate=parseFloat(e.target.value));
    });
    liBox.querySelectorAll("[data-rm]").forEach(b=>b.addEventListener("click",()=>{
      if(lineItems.length<=1) return;
      lineItems.splice(+b.dataset.rm,1);
      draw();
    }));
    el.querySelector("#addLineBtn").addEventListener("click",()=>{
      lineItems.push({description:"",qty:1,unitPrice:0,vatRate:SETTINGS.defaultVatRate});
      draw();
    });
    el.querySelector("#newClientBtn").addEventListener("click",()=>openClientForm(null, "invoiceform"));

    el.querySelector("#fSaveInv").addEventListener("click",()=>{
      const clientId=el.querySelector("#fClient").value;
      if(!clientId){ el.querySelector("#fClient").focus(); return; }
      const issueDate=el.querySelector("#fIssue").value;
      const dueDate=el.querySelector("#fDue").value;
      const notes=el.querySelector("#fNotes").value;
      const cleanItems=lineItems.filter(li=>li.description.trim());
      if(isEdit){
        Object.assign(inv,{clientId,issueDate,dueDate,notes,lineItems:cleanItems});
      } else {
        const number=SETTINGS.nextInvoiceNumber;
        SETTINGS.nextInvoiceNumber=number+1;
        saveSettings();
        inv={id:uid("inv"), number, clientId, issueDate, dueDate, notes, lineItems:cleanItems, status:"draft"};
        INVOICES.push(inv);
      }
      saveInvoices();
      openInvoiceDetail(inv);
    });
  }
  draw();
}

/* =========================================================
   MILEAGE
========================================================= */
function renderMileage(){
  recalcMileageAmounts(); saveMileage();
  const el=document.getElementById("view-mileage");
  const sorted=MILEAGE.slice().sort((a,b)=> b.date<a.date?-1:b.date>a.date?1:0);
  const ty=taxYearLabel(new Date());
  const ytdMiles=MILEAGE.filter(m=>m.vehicleType==="car" && taxYearLabel(new Date(m.date+"T00:00:00"))===ty).reduce((s,m)=>s+m.miles,0);
